<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Check Ponto v3.3 - Biometric Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #39C6FF;
            --secondary: #7B2EFF;
            --accent: #C77DFF;
            --radius: 22px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background:
                radial-gradient(circle at top left, rgba(58, 205, 255, 0.15), transparent 28%),
                radial-gradient(circle at bottom right, rgba(177, 92, 255, 0.18), transparent 30%),
                linear-gradient(135deg,#050816 0%, #0B1026 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            opacity: .35;
            z-index: 0;
        }

        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

        /* HEADER */
        .header-card {
            background: rgba(11, 16, 38, 0.65) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 198, 255, 0.02), rgba(255, 255, 255, 0.15), rgba(57, 198, 255, 0.02), transparent);
            animation: shineSweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
        }

        @keyframes shineSweep { 0% { left: -150%; } 40%, 100% { left: 150%; } }

        .header-row-1 { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
        .header-row-2 { display: flex; align-items: center; justify-content: center; width: 100%; }
        .header-row-3 { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; flex-wrap: wrap; }
        .header-row-4 { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }

        .futuristic-logo {
            width: 55px; height: 55px; 
            filter: drop-shadow(0 0 12px rgba(57, 198, 255, 0.4));
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); filter: brightness(1.2); }
        }

        .brand-title {
            margin: 0; font-size: 1.6rem; font-weight: 800;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .version-tag {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 6px;
            font-weight: 700; margin-left: 6px; vertical-align: middle;
        }

        .date-stepper {
            display: flex; align-items: center; background: rgba(255,255,255,0.04);
            border-radius: 14px; padding: 4px; border: 1px solid rgba(255,255,255,0.08);
        }

        .date-display {
            font-weight: 800; font-size: 1rem; min-width: 140px;
            text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-config {
            background: rgba(255,255,255,0.06); color: #39C6FF; border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.75rem; padding: 8px 15px; text-transform: uppercase; border-radius: 10px;
        }

        button {
            padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none;
            font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; transition: all .2s ease;
            white-space: nowrap;
        }

        .btn-primary { background: linear-gradient(135deg, #39C6FF, #7B2EFF); color: white; box-shadow: 0 5px 15px rgba(57, 198, 255, 0.3); }
        .btn-pdf { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-nav { background: transparent; color: var(--primary); font-size: 1.2rem; padding: 5px 15px; }

        /* DASHBOARD & STATS */
        .chart-card, .stat-box, .table-container {
            background: rgba(20, 25, 55, 0.7); backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius);
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-box { border-bottom: 4px solid rgba(255,255,255,0.1); }
        .stat-box.blue { border-bottom-color: #39C6FF; }
        .stat-box.purple { border-bottom-color: #7B2EFF; }
        .stat-val { font-size: 1.6rem; font-weight: 900; }
        .stat-label { color: #94a3b8; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .stat-money { font-size: 0.85rem; color: #10b981; font-weight: 800; margin-top: 4px; }

        /* TABELAS */
        .table-container { padding: 0; overflow: hidden; margin-bottom: 24px; }
        .scroll-area { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: rgba(57, 198, 255, 0.1); padding: 14px; font-size: 0.75rem; text-transform: uppercase; font-weight: 800; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; }

        .weekend-sat { background: rgba(57, 198, 255, 0.04); }
        .weekend-sun { background: rgba(123, 46, 255, 0.05); }

        input {
            background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: white;
            width: 70px; padding: 6px 2px; text-align: center; font-weight: 700; border-radius: 8px;
        }

        .tabs-nav { display: flex; background: rgba(255,255,255,.03); padding: 5px; border-radius: 14px; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; background: transparent; color: #64748b; font-size: 0.8rem;}
        .tab-btn.active { background: rgba(57, 198, 255, 0.15); color: white; }

        .dashboard-layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }

        /* BIOMETRIA */
        .bio-container {
            max-width: 500px; margin: 0 auto;
        }
        .fingerprint-btn {
            background: rgba(57, 198, 255, 0.05);
            border: 2px solid var(--primary);
            border-radius: 50%;
            width: 130px; height: 130px;
            display: flex; justify-content: center; align-items: center;
            color: var(--primary);
            font-size: 4rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(57, 198, 255, 0.2);
            transition: all 0.3s ease;
            margin: 30px auto;
        }
        .fingerprint-btn:active { transform: scale(0.95); }
        .fingerprint-btn.pulse { animation: neonPulse 2s infinite; }
        .fingerprint-btn:disabled { 
            border-color: #475569; color: #475569; 
            box-shadow: none; animation: none; cursor: not-allowed; 
            background: rgba(255,255,255,0.02);
        }
        
        @keyframes neonPulse {
            0% { box-shadow: 0 0 0 0 rgba(57, 198, 255, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(57, 198, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 198, 255, 0); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: rgba(11, 16, 38, 0.95);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            padding: 30px; text-align: center; width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1.5s ease-in-out; }

        .punch-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 12px 15px;
            border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
        }
        .punch-row.filled { border-left: 4px solid var(--primary); }
        .punch-row.empty { border-left: 4px solid #475569; opacity: 0.6; }

        /* RODAPÉ PREMIUM */
        .footer { padding: 40px 20px; text-align: center; margin-top: 50px; position: relative; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .footer-content {
            background: rgba(20, 25, 55, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: inline-block; padding: 15px 40px; border-radius: 50px;
            border: 1px solid rgba(58, 205, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(58, 205, 255, 0.1);
        }
        .footer-text { color: #94a3b8; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.5px; }
        .footer-text b { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .footer-brand {
            display: block; margin-top: 5px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #39C6FF, #7B2EFF); color: white;
            padding: 12px 30px; border-radius: 50px; display: none; z-index: 1000; font-weight: 700;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        /* OBSERVAÇÕES */
        .obs-container {
            padding: 15px 20px;
            margin-bottom: 24px;
            margin-top: 10px;
            background: rgba(20, 25, 55, 0.7); 
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: var(--radius);
        }
        .obs-title { 
            margin: 0 0 10px 0; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            color: #94a3b8; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .obs-textarea {
            width: 100%; 
            background: rgba(255,255,255,.04); 
            border: 1px solid rgba(255,255,255,.08);
            color: white; 
            padding: 12px; 
            border-radius: 12px; 
            font-family: inherit; 
            font-size: 0.9rem;
            resize: vertical; 
            min-height: 120px;
            transition: border-color 0.3s;
        }
        .obs-textarea:focus { outline: none; border-color: var(--primary); }

        .obs-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-save-obs {
            background: rgba(57, 198, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 15px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-save-obs:hover {
            background: rgba(57, 198, 255, 0.2);
        }

        @media (max-width: 768px) {
            .brand-title { font-size: 1.3rem; }
            .header-row-3 { flex-direction: column; width: 100%; }
            .btn-config { width: 100%; }
            .dashboard-layout { grid-template-columns: 1fr; }
            .tabs-nav { flex-wrap: wrap; }
            .tab-btn { flex: 1 1 30%; font-size: 0.7rem; padding: 10px 5px;}
        }
    </style>
</head>
<body>
<div id="app"></div>

<div id="biometric-modal" class="modal-overlay">
    <div class="modal-content">
        <i id="modal-icon" class="fa-solid fa-fingerprint animate-pulse" style="font-size: 4rem; color: var(--primary);"></i>
        <h3 style="margin: 15px 0 5px 0; font-size: 1.2rem;">Autenticação Biométrica</h3>
        <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;" id="auth-status">Toque no sensor...</p>
        <div class="progress-bar-bg">
            <div id="auth-progress" class="progress-bar-fill"></div>
        </div>
        <p style="font-size: 0.7rem; color: #475569;">O horário será registrado através do servidor central.</p>
    </div>
</div>

<script>
    (function() {
        let jornadaDiaria = 480; 
        let valorHoraNormal = 10.32; 
        
        // Feriados fixos (incluindo o Santo Antônio que havíamos adicionado como exemplo)
        const feriadosFixos = { '0-1': 'Ano Novo', '3-21': 'Tiradentes', '4-1': 'Dia do Trabalho', '5-13': 'Santo Antônio', '8-7': 'Independência', '9-12': 'N. Sra Aparecida', '10-2': 'Finados', '10-15': 'Proclamação', '10-20': 'Consc. Negra', '11-25': 'Natal' };
        
        function calcularPascoa(ano) {
            const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(ano, mes - 1, dia);
        }
        function getFeriadosMoveis(ano) {
            const p = calcularPascoa(ano), c = new Date(p); c.setDate(p.getDate() - 47); const s = new Date(p); s.setDate(p.getDate() - 2); const cc = new Date(p); cc.setDate(p.getDate() + 60);
            return { [`${c.getMonth()}-${c.getDate()}`]: 'Carnaval', [`${s.getMonth()}-${s.getDate()}`]: 'Sexta-Feira Santa', [`${cc.getMonth()}-${cc.getDate()}`]: 'Corpus Christi' };
        }
        function isFeriado(mes, dia, ano) { const chave = `${mes}-${dia}`, moveis = getFeriadosMoveis(ano); return feriadosFixos[chave] || moveis[chave] || null; }
        function diasNoMes(ano, mes) { return new Date(ano, mes + 1, 0).getDate(); }
        function horaToMin(h) { if (!h || !h.includes(':')) return 0; const [hr, mn] = h.split(':').map(Number); return hr * 60 + mn; }
        function minToHora(min) { const absMin = Math.abs(min); const h = Math.floor(absMin / 60), m = absMin % 60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`; }

        let ano = new Date().getFullYear();
        let mes = new Date().getMonth();
        let registros = {};
        let observacoes = {};
        let abaAtiva = 'bater_ponto';
        let cacheTotais = { trab:0, normal:0, extra50:0, extra100:0 };
        let chartDist = null, chartEvol = null;

        const salvo = localStorage.getItem('folhaPonto_v2.9');
        if (salvo) { 
            try { 
                const p = JSON.parse(salvo); 
                registros = p.registros || {}; 
                jornadaDiaria = p.jornadaDiaria || 480; 
                valorHoraNormal = p.valorHoraNormal || 10.32; 
                observacoes = p.observacoes || {};
            } catch(e) {} 
        }
        
        const mesesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const diasNomes = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

        function calcularValoresDia(chave, semNum, mesNum, diaNum, anoNum) {
            const d = registros[chave] || {};
            const e1 = horaToMin(d.ent1), s1 = horaToMin(d.sai1), e2 = horaToMin(d.ent2), s2 = horaToMin(d.sai2);
            let trab = 0; 
            if (s1 > e1) trab += s1 - e1; 
            if (s2 > e2) trab += s2 - e2;
            
            let normal = 0, e50 = 0, e100 = 0;
            const feriado = isFeriado(mesNum, diaNum, anoNum);
            const feriadoManual = d.feriadoManual === true; // NOVO: Verifica tag de 100% manual
            
            // NOVO: Adicionado feriadoManual na condição para calcular tudo como 100%
            if (semNum === 0 || feriado || feriadoManual) {
                e100 = trab;
            } else if (semNum === 6) { 
                normal = Math.min(trab, 240); 
                let excesso = trab - 240;
                e50 = excesso > 10 ? excesso : 0; 
            } else { 
                normal = Math.min(trab, jornadaDiaria); 
                let excesso = trab - jornadaDiaria;
                e50 = excesso > 10 ? excesso : 0; 
            }
            return { trab, normal, extra50: e50, extra100: e100 };
        }

        function recalcularTotais() {
            let n = { trab:0, normal:0, extra50:0, extra100:0 };
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(`${ano}-${mes}-${d}`, new Date(ano, mes, d).getDay(), mes, d, ano);
                n.trab += s.trab; n.normal += s.normal; n.extra50 += s.extra50; n.extra100 += s.extra100;
            }
            cacheTotais = n; return n;
        }

        async function exportarPDF() {
            recalcularTotais();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(57, 198, 255);
            doc.text("CHECK PONTO", 20, 20);

            doc.setFontSize(10); doc.setTextColor(100, 100, 100);
            doc.text(`Relatório Oficial Premium v3.0 • Gerado em ${new Date().toLocaleDateString()}`, 20, 28);
            doc.line(20, 32, 190, 32);

            doc.setFontSize(11); doc.setTextColor(0, 0, 0);
            doc.text(`Período: ${mesesNomes[mes]} de ${ano}`, 20, 42);
            doc.text(`Jornada: ${Math.floor(jornadaDiaria/60)}h | Valor Hora: R$ ${valorHoraNormal.toFixed(2)}`, 110, 42);

            const tableBody = [];
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const k = `${ano}-${mes}-${d}`;
                const dt = new Date(ano, mes, d);
                const st = calcularValoresDia(k, dt.getDay(), mes, d, ano);
                const reg = registros[k] || {};
                
                // NOVO: Adicionar indicativo visual no PDF se for feriado manual
                let nomeDiaStr = diasNomes[dt.getDay()];
                const fer = isFeriado(mes, d, ano);
                if (fer) nomeDiaStr += ` (${fer})`;
                else if (reg.feriadoManual) nomeDiaStr += ` (100% Man.)`;

                tableBody.push([
                    `${d.toString().padStart(2,'0')}/${(mes+1).toString().padStart(2,'0')}`,
                    nomeDiaStr, reg.ent1 || '-', reg.sai1 || '-', reg.ent2 || '-', reg.sai2 || '-',
                    minToHora(st.trab), minToHora(st.extra50), minToHora(st.extra100)
                ]);
            }

            const val50 = (cacheTotais.extra50 / 60 * valorHoraNormal * 1.5).toFixed(2);
            const val100 = (cacheTotais.extra100 / 60 * valorHoraNormal * 2.0).toFixed(2);

            doc.autoTable({
                startY: 48,
                head: [['Data', 'Dia', 'E1', 'S1', 'E2', 'S2', 'Total', '50%', '100%']],
                body: tableBody,
                theme: 'grid',
                headStyles: { fillColor: [57, 198, 255], halign: 'center', textColor: 255 },
                styles: { fontSize: 8, halign: 'center' },
                foot: [
                    [ { content: 'TOTAIS (HORAS)', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold' } }, minToHora(cacheTotais.trab), minToHora(cacheTotais.extra50), minToHora(cacheTotais.extra100) ],
                    [ { content: 'SALDO EM DINHEIRO (R$)', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold' } }, '-', `R$ ${val50}`, `R$ ${val100}` ]
                ],
                footStyles: { fillColor: [240, 240, 240], textColor: 0, lineWidth: 0.1 }
            });

            const obsKey = `${ano}-${mes}`;
            const obsText = observacoes[obsKey];
            if (obsText && obsText.trim() !== '') {
                let finalY = doc.lastAutoTable.finalY || 250;
                if (finalY > 260) { doc.addPage(); finalY = 20; } 
                else { finalY += 15; }

                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                doc.text("Observações:", 20, finalY);
                
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(80, 80, 80);
                const splitObs = doc.splitTextToSize(obsText, 170);
                doc.text(splitObs, 20, finalY + 6);
            }

            doc.save(`CheckPonto_v30_${mesesNomes[mes]}_${ano}.pdf`);
            mostrarToast("📄 PDF Exportado com Saldo!");
        }

        function initCharts() {
            if (abaAtiva !== 'dashboard') return;
            const distCtx = document.getElementById('chartDist'), evolCtx = document.getElementById('chartEvol');
            if (!distCtx || !evolCtx) return;
            if (chartDist) chartDist.destroy(); if (chartEvol) chartEvol.destroy();

            chartDist = new Chart(distCtx.getContext('2d'), {
                type: 'bar',
                data: { labels: ['Normal', '50%', '100%'], datasets: [{ data: [cacheTotais.normal/60, cacheTotais.extra50/60, cacheTotais.extra100/60], backgroundColor: ['#39C6FF', '#7B2EFF', '#C77DFF'], borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            let labels = [], d50 = [], d100 = [];
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(`${ano}-${mes}-${d}`, new Date(ano, mes, d).getDay(), mes, d, ano);
                labels.push(d); 
                d50.push((s.extra50 / 60).toFixed(1)); 
                d100.push((s.extra100 / 60).toFixed(1));
            }
            
            chartEvol = new Chart(evolCtx.getContext('2d'), {
                type: 'line',
                data: { labels: labels, datasets: [{ label: '50%', data: d50, borderColor: '#39C6FF', tension: 0.3 }, { label: '100%', data: d100, borderColor: '#7B2EFF', tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function salvar(silencioso = false) { 
            localStorage.setItem('folhaPonto_v2.9', JSON.stringify({ registros, jornadaDiaria, valorHoraNormal, observacoes })); 
            if(!silencioso) mostrarToast('✅ Dados guardados!'); 
        }
        
        function salvarObservacao() {
            const textarea = document.getElementById('obs-textarea');
            if (textarea) {
                const obsKey = `${ano}-${mes}`;
                observacoes[obsKey] = textarea.value;
                salvar(true);
                mostrarToast('✅ Observação salva com sucesso!');
            }
        }

        function validarEAtualizar(chave, campo, input) {
            let v = input.value, f = v.replace(/\D/g, ''); 
            if (f.length > 4) f = f.slice(0,4);
            if (f.length >= 3) f = f.slice(0,2) + ':' + f.slice(2);
            if (f !== input.value) input.value = f;
            if (!registros[chave]) registros[chave] = {}; 
            registros[chave][campo] = f;
            
            recalcularTotais();
            
            const dNum = parseInt(chave.split('-')[2]);
            const st = calcularValoresDia(chave, new Date(ano, mes, dNum).getDay(), mes, dNum, ano);
            const tr = input.closest('tr');
            if (tr) {
                tr.querySelector('.col-total').innerText = minToHora(st.trab);
                tr.querySelector('.col-norm').innerText = minToHora(st.normal);
                tr.querySelector('.col-50').innerText = minToHora(st.extra50);
                tr.querySelector('.col-100').innerText = minToHora(st.extra100);
            }
            const tfoot = document.querySelector('tfoot');
            if (tfoot) {
                tfoot.querySelector('.tot-trab').innerText = minToHora(cacheTotais.trab);
                tfoot.querySelector('.tot-norm').innerText = minToHora(cacheTotais.normal);
                tfoot.querySelector('.tot-50').innerText = minToHora(cacheTotais.extra50);
                tfoot.querySelector('.tot-100').innerText = minToHora(cacheTotais.extra100);
            }
        }

        // NOVO: Função para ativar/desativar 100% manual
        function toggleFeriadoManual(chave) {
            if (!registros[chave]) registros[chave] = {};
            registros[chave].feriadoManual = !registros[chave].feriadoManual; 
            salvar(true); 
            recalcularTotais();
            renderizar();
        }

        function configJornada() { const v = prompt("Nova Jornada Diária em horas (ex: 8):", (jornadaDiaria/60)); if (v !== null && v !== "") { jornadaDiaria = Math.round(parseFloat(v.replace(',', '.')) * 60); recalcularTotais(); renderizar(); salvar(); } }
        function configHora() { const v = prompt("Novo Valor da Hora (R$):", valorHoraNormal.toFixed(2)); if (v !== null && v !== "") { valorHoraNormal = parseFloat(v.replace(',', '.')); recalcularTotais(); renderizar(); salvar(); } }
        function mudarMes(delta) { mes += delta; if (mes<0){mes=11;ano--;} if (mes>11){mes=0;ano++;} recalcularTotais(); renderizar(); if (abaAtiva === 'dashboard') setTimeout(initCharts, 50); }
        function mostrarToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function mudarAba(nova) { abaAtiva = nova; renderizar(); if (nova === 'dashboard') setTimeout(initCharts, 100); }

        function requestBiometrics() {
            const modal = document.getElementById('biometric-modal');
            const progress = document.getElementById('auth-progress');
            const status = document.getElementById('auth-status');
            const icon = document.getElementById('modal-icon');
            
            modal.style.display = 'flex';
            progress.style.width = '0%';
            progress.style.transition = 'none';
            status.innerText = "Lendo digital...";
            status.style.color = "#94a3b8";
            icon.className = "fa-solid fa-fingerprint animate-pulse";
            icon.style.color = "var(--primary)";

            setTimeout(() => {
                progress.style.transition = 'width 1.5s ease-in-out';
                progress.style.width = '100%';
                status.innerText = "Autenticando no servidor...";
                status.style.color = "var(--primary)";
                
                setTimeout(() => {
                    status.innerText = "Sucesso!";
                    status.style.color = "#10b981";
                    icon.className = "fa-solid fa-check-circle";
                    icon.style.color = "#10b981";
                    
                    setTimeout(() => {
                        modal.style.display = 'none';
                        registrarPontoAutomatico(); 
                    }, 800);
                }, 1500);
            }, 300);
        }

        function registrarPontoAutomatico() {
            const hoje = new Date();
            const d = hoje.getDate();
            const m = hoje.getMonth();
            const a = hoje.getFullYear();
            const chaveHoje = `${a}-${m}-${d}`;
            
            const horaAtual = hoje.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            if (!registros[chaveHoje]) registros[chaveHoje] = {};
            let r = registros[chaveHoje];

            let msg = "";
            if (!r.ent1) { r.ent1 = horaAtual; msg = "Entrada 1 registrada"; }
            else if (!r.sai1) { r.sai1 = horaAtual; msg = "Início de Pausa registrado"; }
            else if (!r.ent2) { r.ent2 = horaAtual; msg = "Retorno de Pausa registrado"; }
            else if (!r.sai2) { r.sai2 = horaAtual; msg = "Saída Final registrada"; }
            
            mostrarToast(`✅ ${msg} às ${horaAtual}`);
            
            ano = a;
            mes = m;
            
            salvar(true); 
            recalcularTotais();
            renderizar();
        }

        setInterval(() => {
            const clockElem = document.getElementById('bio-clock');
            const dateElem = document.getElementById('bio-date');
            if (clockElem && dateElem) {
                const now = new Date();
                clockElem.innerText = now.toLocaleTimeString('pt-BR', { hour12: false });
                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                let ds = now.toLocaleDateString('pt-BR', options);
                dateElem.innerText = ds.charAt(0).toUpperCase() + ds.slice(1);
            }
        }, 1000);

        function renderizar() {
            let corpo = '';
            const td = diasNoMes(ano, mes);

            if (abaAtiva === 'dashboard') {
                corpo = `<div class="dashboard-layout">
                    <div class="stats-column">
                        <div class="stats-grid">
                            <div class="stat-box blue"><span class="stat-label">Normal</span><div class="stat-val">${minToHora(cacheTotais.normal)}h</div></div>
                            <div class="stat-box cyan"><span class="stat-label">Extra 50%</span><div class="stat-val">${minToHora(cacheTotais.extra50)}</div><div class="stat-money">R$ ${(cacheTotais.extra50/60 * valorHoraNormal * 1.5).toFixed(2)}</div></div>
                            <div class="stat-box purple"><span class="stat-label">Extra 100%</span><div class="stat-val">${minToHora(cacheTotais.extra100)}</div><div class="stat-money">R$ ${(cacheTotais.extra100/60 * valorHoraNormal * 2.0).toFixed(2)}</div></div>
                            <div class="stat-box"><span class="stat-label">Total Geral</span><div class="stat-val">${minToHora(cacheTotais.trab)}h</div></div>
                        </div>
                        <div class="chart-card" style="height: 200px;"><canvas id="chartDist"></canvas></div>
                    </div>
                    <div class="chart-card" style="height: 380px;"><canvas id="chartEvol"></canvas></div>
                </div>`;
            } else if (abaAtiva === 'lancamentos') {
                let rows = '';
                for (let d = 1; d <= td; d++) {
                    const dt = new Date(ano, mes, d), sem = dt.getDay(), k = `${ano}-${mes}-${d}`, st = calcularValoresDia(k, sem, mes, d, ano), fer = isFeriado(mes, d, ano);
                    const reg = registros[k] || {};
                    let rowClass = (sem === 6) ? 'weekend-sat' : (sem === 0) ? 'weekend-sun' : 'weekday';

                    // NOVO: Gerando botão de 100% manual (só exibe se não for domingo)
                    const isFeriadoManual = reg.feriadoManual ? true : false;
                    const btn100 = `<span onclick="toggleFeriadoManual('${k}')" style="cursor:pointer; display:inline-block; margin-left:6px; padding: 2px 5px; border-radius:6px; font-size:0.6rem; font-weight:800; background:${isFeriadoManual ? '#C77DFF' : 'rgba(255,255,255,0.05)'}; color:${isFeriadoManual ? '#fff' : '#64748b'}; border: 1px solid ${isFeriadoManual ? '#C77DFF' : '#475569'}; transition: all 0.2s;" title="Ativar/Desativar 100% Manual">100%</span>`;

                    rows += `<tr class="${rowClass}">
                        <td style="font-weight:800">${d.toString().padStart(2,'0')}/${(mes+1).toString().padStart(2,'0')}</td>
                        <td style="color:${sem===0?'#7B2EFF':(sem===6?'#39C6FF':'#94a3b8')}">
                            ${diasNomes[sem]}${fer ? ' (' + fer + ')' : ''} ${sem !== 0 ? btn100 : ''}
                        </td>
                        <td><input type="text" inputmode="numeric" value="${reg.ent1||''}" oninput="validarEAtualizar('${k}','ent1',this)"></td>
                        <td><input type="text" inputmode="numeric" value="${reg.sai1||''}" oninput="validarEAtualizar('${k}','sai1',this)"></td>
                        <td><input type="text" inputmode="numeric" value="${reg.ent2||''}" oninput="validarEAtualizar('${k}','ent2',this)"></td>
                        <td><input type="text" inputmode="numeric" value="${reg.sai2||''}" oninput="validarEAtualizar('${k}','sai2',this)"></td>
                        <td class="col-total" style="font-weight:900">${minToHora(st.trab)}</td>
                        <td class="col-norm" style="color:#39C6FF">${minToHora(st.normal)}</td>
                        <td class="col-50" style="color:#C77DFF">${minToHora(st.extra50)}</td>
                        <td class="col-100" style="color:#7B2EFF">${minToHora(st.extra100)}</td>
                    </tr>`;
                }
                
                const obsKey = `${ano}-${mes}`;
                const obsValue = observacoes[obsKey] || '';

                corpo = `<div class="table-container"><div class="scroll-area"><table>
                    <thead><tr><th>Data</th><th>Dia</th><th>E1</th><th>S1</th><th>E2</th><th>S2</th><th>Total</th><th>Norm</th><th>50%</th><th>100%</th></tr></thead>
                    <tbody>${rows}</tbody>
                    <tfoot style="background: rgba(57, 198, 255, 0.1); font-weight: bold;">
                        <tr><td colspan="6" style="text-align: right; padding-right: 15px;">TOTAIS</td>
                        <td class="tot-trab">${minToHora(cacheTotais.trab)}</td><td class="tot-norm" style="color:#39C6FF">${minToHora(cacheTotais.normal)}</td><td class="tot-50" style="color:#C77DFF">${minToHora(cacheTotais.extra50)}</td><td class="tot-100" style="color:#7B2EFF">${minToHora(cacheTotais.extra100)}</td></tr>
                    </tfoot>
                </table></div></div>
                
                <div class="obs-container">
                    <div class="obs-title">
                        <i class="fa-regular fa-note-sticky"></i>
                        Observações do Mês
                        <span style="font-size: 0.7rem; color: #64748b;">(salva automaticamente)</span>
                    </div>
                    <textarea id="obs-textarea" class="obs-textarea" placeholder="Digite suas observações sobre este mês... Ex: Faltas justificadas, horas extras autorizadas, banco de horas, etc." onchange="salvarObservacao()">${obsValue}</textarea>
                    <div class="obs-footer">
                        <button class="btn-save-obs" onclick="salvarObservacao()">
                            <i class="fa-regular fa-floppy-disk"></i> Salvar Observação
                        </button>
                    </div>
                </div>`;
            } else if (abaAtiva === 'bater_ponto') {
                const hoje = new Date();
                const chaveHoje = `${hoje.getFullYear()}-${hoje.getMonth()}-${hoje.getDate()}`;
                const regHoje = registros[chaveHoje] || {};
                
                const totalBatidas = (regHoje.ent1?1:0) + (regHoje.sai1?1:0) + (regHoje.ent2?1:0) + (regHoje.sai2?1:0);
                const isBloqueado = totalBatidas >= 4;
                
                let textStatus = "Pressione para bater o ponto";
                if (totalBatidas === 1) textStatus = "Pressione para registrar Início da Pausa";
                if (totalBatidas === 2) textStatus = "Pressione para registrar Retorno da Pausa";
                if (totalBatidas === 3) textStatus = "Pressione para registrar Saída Final";
                if (isBloqueado) textStatus = "Expediente de hoje concluído!";

                corpo = `<div class="chart-card bio-container">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 5px; background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Ponto Biométrico</h2>
                        <p style="color: #94a3b8; font-size: 0.9rem;" id="bio-date">Carregando data...</p>
                        <div style="font-size: 3.5rem; font-weight: 800; margin: 15px 0; font-variant-numeric: tabular-nums; letter-spacing: 2px;" id="bio-clock">--:--:--</div>
                    </div>
                    
                    <div style="text-align: center;">
                        <button id="fingerprint-btn" onclick="requestBiometrics()" class="fingerprint-btn ${isBloqueado ? '' : 'pulse'}" ${isBloqueado ? 'disabled' : ''}>
                            <i class="fa-solid fa-fingerprint"></i>
                        </button>
                        <p id="bio-status" style="margin-top: 15px; color: ${isBloqueado ? '#10b981' : 'var(--primary)'}; font-weight: bold; font-size: 1.1rem;">
                            ${isBloqueado ? '<i class="fa-solid fa-check"></i> ' : ''}${textStatus}
                        </p>
                    </div>

                    <div style="margin-top: 40px;">
                        <h3 style="margin: 0 0 15px 0; font-size: 0.9rem; text-transform: uppercase; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
                            Registros de Hoje <span style="float:right; color: #fff;">${totalBatidas}/4</span>
                        </h3>
                        
                        <div class="punch-row ${regHoje.ent1 ? 'filled' : 'empty'}">
                            <span><i class="fa-solid fa-arrow-right-to-bracket" style="color: #10b981; margin-right: 10px;"></i> Entrada 1</span>
                            <strong style="font-size: 1.1rem;">${regHoje.ent1 || '--:--'}</strong>
                        </div>
                        <div class="punch-row ${regHoje.sai1 ? 'filled' : 'empty'}">
                            <span><i class="fa-solid fa-mug-hot" style="color: #f59e0b; margin-right: 10px;"></i> Saída (Pausa)</span>
                            <strong style="font-size: 1.1rem;">${regHoje.sai1 || '--:--'}</strong>
                        </div>
                        <div class="punch-row ${regHoje.ent2 ? 'filled' : 'empty'}">
                            <span><i class="fa-solid fa-briefcase" style="color: #3b82f6; margin-right: 10px;"></i> Retorno (Pausa)</span>
                            <strong style="font-size: 1.1rem;">${regHoje.ent2 || '--:--'}</strong>
                        </div>
                        <div class="punch-row ${regHoje.sai2 ? 'filled' : 'empty'}">
                            <span><i class="fa-solid fa-arrow-right-from-bracket" style="color: #ef4444; margin-right: 10px;"></i> Saída Final</span>
                            <strong style="font-size: 1.1rem;">${regHoje.sai2 || '--:--'}</strong>
                        </div>
                    </div>
                </div>`;
            }

            document.getElementById('app').innerHTML = `<div class="container">
                <header class="header-card">
                    <div class="header-row-1">
                        <div class="futuristic-logo">
                            <svg viewBox="0 0 1024 620" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <defs>
                                <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#39C6FF"/><stop offset="100%" stop-color="#2E5BFF"/></linearGradient>
                                <linearGradient id="neonPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C77DFF"/><stop offset="100%" stop-color="#7B2EFF"/></linearGradient>
                                <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3ACDFF"/><stop offset="100%" stop-color="#B15CFF"/></linearGradient>
                                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                              </defs>
                              <circle cx="512" cy="310" r="220" stroke="url(#neonBlue)" stroke-width="26" fill="none" filter="url(#glow)" stroke-dasharray="1200" stroke-dashoffset="140"/>
                              <path d="M680 120 A220 220 0 0 1 785 280" stroke="url(#neonPurple)" stroke-width="30" fill="none" stroke-linecap="round" filter="url(#glow)"/>
                              <path d="M430 315 L505 390 L675 230" stroke="url(#textGradient)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
                              <rect x="500" y="120" width="14" height="42" rx="7" fill="#46CFFF" filter="url(#glow)"/><rect x="500" y="458" width="14" height="42" rx="7" fill="#46CFFF" filter="url(#glow)"/>
                              <rect x="328" y="292" width="42" height="14" rx="7" fill="#46CFFF" filter="url(#glow)"/><rect x="654" y="292" width="42" height="14" rx="7" fill="#B15CFF" filter="url(#glow)"/>
                              <rect x="675" y="405" width="52" height="120" rx="10" fill="url(#neonBlue)" filter="url(#glow)"/><rect x="740" y="355" width="52" height="170" rx="10" fill="#7F8BFF" filter="url(#glow)"/><rect x="805" y="300" width="52" height="225" rx="10" fill="url(#neonPurple)" filter="url(#glow)"/>
                              <path d="M650 530 Q760 570 880 515" stroke="url(#neonBlue)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#glow)"/>
                            </svg>
                        </div>
                        <h1 class="brand-title">Check Ponto <span class="version-tag">v3.0</span></h1>
                    </div>

                    <div class="header-row-2">
                        <div class="date-stepper">
                            <button class="btn-nav" onclick="mudarMes(-1)">❮</button>
                            <div class="date-display">${mesesNomes[mes]} ${ano}</div>
                            <button class="btn-nav" onclick="mudarMes(1)">❯</button>
                        </div>
                    </div>

                    <div class="header-row-3">
                        <button class="btn-config" onclick="configJornada()">⚙️ JORNADA: ${Math.floor(jornadaDiaria/60)}H</button>
                        <button class="btn-config" onclick="configHora()">💰 HORA: R$ ${valorHoraNormal.toFixed(2)}</button>
                    </div>

                    <div class="header-row-4">
                        <button class="btn-primary" onclick="salvar()">💾 SALVAR</button>
                        <button class="btn-pdf" onclick="exportarPDF()">📄 PDF</button>
                    </div>
                </header>

                <nav class="tabs-nav">
                    <button class="tab-btn ${abaAtiva==='bater_ponto'?'active':''}" onclick="mudarAba('bater_ponto')"><i class="fa-solid fa-fingerprint"></i> BATER PONTO</button>
                    <button class="tab-btn ${abaAtiva==='lancamentos'?'active':''}" onclick="mudarAba('lancamentos')"><i class="fa-solid fa-pen-to-square"></i> LANÇAMENTOS</button>
                    <button class="tab-btn ${abaAtiva==='dashboard'?'active':''}" onclick="mudarAba('dashboard')"><i class="fa-solid fa-chart-pie"></i> DASHBOARD</button>
                </nav>

                ${corpo}

                <footer class="footer">
                    <div class="footer-content">
                        <span class="footer-text">Criado por <b>Deh Januário</b></span>
                        <span class="footer-brand">Check Ponto • v3.3 Premium</span>
                    </div>
                </footer>
                <div id="toast" class="toast"></div>
            </div>`;
        }

        window.validarEAtualizar = validarEAtualizar; 
        window.mudarMes = mudarMes; 
        window.salvar = salvar; 
        window.configJornada = configJornada; 
        window.configHora = configHora; 
        window.mudarAba = mudarAba; 
        window.exportarPDF = exportarPDF;
        window.requestBiometrics = requestBiometrics;
        window.salvarObservacao = salvarObservacao;
        window.toggleFeriadoManual = toggleFeriadoManual; 

        recalcularTotais(); renderizar(); 
    })();
</script>
</body>
</html>
