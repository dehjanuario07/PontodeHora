<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Check Ponto v2.6 - Premium Edition</title>
    <!-- Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #39C6FF;
            --secondary: #7B2EFF;
            --accent: #C77DFF;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 22px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background:
                radial-gradient(circle at top left, rgba(58, 205, 255, 0.15), transparent 28%),
                radial-gradient(circle at bottom right, rgba(177, 92, 255, 0.18), transparent 30%),
                linear-gradient(135deg,#050816 0%, #0B1026 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            opacity: .35;
            z-index: 0;
        }

        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

        .header-card {
            background: rgba(11, 16, 38, 0.65) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 15px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 198, 255, 0.02), rgba(255, 255, 255, 0.15), rgba(57, 198, 255, 0.02), transparent);
            animation: shineSweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes shineSweep {
            0% { left: -150%; }
            40%, 100% { left: 150%; }
        }

        .brand-section { display: flex; align-items: center; gap: 15px; position: relative; z-index: 2; }
        
        .futuristic-logo {
            width: 95px;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 12px rgba(57, 198, 255, 0.4));
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); filter: brightness(1) drop-shadow(0 0 12px rgba(57, 198, 255, 0.4)); }
            50% { transform: translateY(-6px); filter: brightness(1.25) drop-shadow(0 0 20px rgba(57, 198, 255, 0.6)); }
        }

        .brand-info { display: flex; flex-direction: column; }

        .brand-section h1 {
            color: #fff !important;
            margin: 0;
            text-shadow: 0 0 12px rgba(58, 205, 255, 0.4);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .version-tag {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF) !important;
            color: white !important;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            margin-left: 6px;
            vertical-align: middle;
            display: inline-block;
            box-shadow: 0 0 10px rgba(57, 198, 255, 0.3);
        }

        button {
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all .2s ease;
            position: relative;
            z-index: 2;
        }

        .btn-primary {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF) !important;
            color: white !important;
            box-shadow: 0 0 18px rgba(57, 198, 255, 0.3);
        }

        .btn-ghost, .btn-config, .btn-nav {
            background: rgba(255,255,255,0.06) !important;
            color: #fff !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
        }

        .btn-ghost:hover {
            background: rgba(57, 198, 255, 0.1) !important;
        }

        .date-display { font-weight: 800; font-size: 1rem; min-width: 140px; text-align: center; }

        .chart-card, .stat-box, .table-container {
            background: rgba(20, 25, 55, 0.7) !important;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-box { border-bottom: 4px solid rgba(255,255,255,0.1) !important; }
        .stat-box.blue { border-bottom-color: #39C6FF !important; }
        .stat-box.purple { border-bottom-color: #7B2EFF !important; }
        .stat-box.cyan { border-bottom-color: #C77DFF !important; }

        .stat-val { font-size: 1.6rem; font-weight: 900; }
        .stat-label { color: #94a3b8 !important; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }

        .table-container { padding: 0; overflow: hidden; margin-bottom: 24px; }
        .scroll-area { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        
        th {
            background: rgba(57, 198, 255, 0.1) !important;
            padding: 14px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; }

        input {
            background: rgba(255,255,255,.04) !important;
            border: 1px solid rgba(255,255,255,.08) !important;
            color: white !important;
            width: 70px;
            padding: 6px 2px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #39C6FF !important;
            box-shadow: 0 0 10px rgba(57, 198, 255, 0.3) !important;
            background: rgba(255,255,255,.08) !important;
        }

        .tabs-nav {
            display: flex;
            background: rgba(255,255,255,.03);
            padding: 5px;
            border-radius: 14px;
            gap: 5px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            background: transparent;
            color: #64748b;
        }

        .tab-btn.active {
            background: rgba(57, 198, 255, 0.15);
            color: white;
            box-shadow: 0 0 15px rgba(57, 198, 255, 0.1);
        }

        .dashboard-layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
        .controls-area { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; position: relative; z-index: 2; }
        .date-controls { display: flex; align-items: center; gap: 8px; }

        .date-stepper {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 2px;
        }

        .footer {
            padding: 30px 8px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,.06);
            margin-top: 30px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
            font-weight: 700;
        }

        @media (max-width: 992px) { .dashboard-layout { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .header-card { flex-direction: column; text-align: center; padding: 20px; }
            .brand-section { flex-direction: row; justify-content: center; }
            .controls-area { align-items: center; width: 100%; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    (function() {
        let jornadaDiaria = 480; 
        let valorHoraNormal = 10.32; 
        const feriadosFixos = { '0-1': 'Ano Novo', '3-21': 'Tiradentes', '4-1': 'Dia do Trabalho', '8-7': 'Independência', '9-12': 'N. Sra Aparecida', '10-2': 'Finados', '10-15': 'Proclamação', '10-20': 'Consc. Negra', '11-25': 'Natal' };
        
        function calcularPascoa(ano) {
            const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(ano, mes - 1, dia);
        }
        function getFeriadosMoveis(ano) {
            const p = calcularPascoa(ano), c = new Date(p); c.setDate(p.getDate() - 47); const s = new Date(p); s.setDate(p.getDate() - 2); const cc = new Date(p); cc.setDate(p.getDate() + 60);
            return { [`${c.getMonth()}-${c.getDate()}`]: 'Carnaval', [`${s.getMonth()}-${s.getDate()}`]: 'Sexta-Feira Santa', [`${cc.getMonth()}-${cc.getDate()}`]: 'Corpus Christi' };
        }
        function isFeriado(mes, dia, ano) { const chave = `${mes}-${dia}`, moveis = getFeriadosMoveis(ano); return feriadosFixos[chave] || moveis[chave] || null; }
        function diasNoMes(ano, mes) { return new Date(ano, mes + 1, 0).getDate(); }
        function horaToMin(h) { if (!h || !h.includes(':')) return 0; const [hr, mn] = h.split(':').map(Number); return (isNaN(hr) || isNaN(mn)) ? 0 : hr * 60 + mn; }
        function minToHora(min) { const absMin = Math.abs(min); const h = Math.floor(absMin / 60), m = absMin % 60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`; }

        let ano = new Date().getFullYear();
        let mes = new Date().getMonth();
        let registros = {};
        let abaAtiva = 'lancamentos'; 
        let cacheTotais = { trab:0, normal:0, extra50:0, extra100:0 };
        let chartDist = null, chartEvol = null;

        const salvo = localStorage.getItem('folhaPonto');
        if (salvo) { try { const p = JSON.parse(salvo); registros = p.registros || {}; jornadaDiaria = p.jornadaDiaria || 480; valorHoraNormal = p.valorHoraNormal || 10.32; } catch(e) {} }
        
        const mesesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const diasNomes = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

        function calcularValoresDia(chave, semNum, mesNum, diaNum, anoNum) {
            const d = registros[chave] || {};
            const e1 = horaToMin(d.ent1), s1 = horaToMin(d.sai1), e2 = horaToMin(d.ent2), s2 = horaToMin(d.sai2);
            let trab = 0; if (s1 > e1) trab += s1 - e1; if (s2 > e2) trab += s2 - e2;
            let normal = 0, e50 = 0, e100 = 0;
            const feriado = isFeriado(mesNum, diaNum, anoNum);
            if (semNum === 0 || feriado) e100 = trab;
            else if (semNum === 6) { normal = Math.min(trab, 240); e50 = Math.max(0, trab - 240); }
            else { normal = Math.min(trab, jornadaDiaria); e50 = Math.max(0, trab - jornadaDiaria); }
            return { trab, normal, extra50: e50, extra100: e100 };
        }

        function recalcularTotais() {
            let n = { trab:0, normal:0, extra50:0, extra100:0 };
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(`${ano}-${mes}-${d}`, new Date(ano, mes, d).getDay(), mes, d, ano);
                n.trab += s.trab; n.normal += s.normal; n.extra50 += s.extra50; n.extra100 += s.extra100;
            }
            cacheTotais = n; return n;
        }

        function initCharts() {
            if (abaAtiva !== 'dashboard') return;
            const distCtx = document.getElementById('chartDist'), evolCtx = document.getElementById('chartEvol');
            if (!distCtx || !evolCtx) return;
            if (chartDist) chartDist.destroy();
            if (chartEvol) chartEvol.destroy();

            chartDist = new Chart(distCtx.getContext('2d'), {
                type: 'bar',
                data: { labels: ['Normal', '50%', '100%'], datasets: [{ data: [cacheTotais.normal/60, cacheTotais.extra50/60, cacheTotais.extra100/60], backgroundColor: ['#39C6FF', '#7F8BFF', '#7B2EFF'], borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });

            let labels = [], d50 = [], d100 = [], ac50 = 0, ac100 = 0;
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(`${ano}-${mes}-${d}`, new Date(ano, mes, d).getDay(), mes, d, ano);
                ac50 += s.extra50 / 60; ac100 += s.extra100 / 60;
                labels.push(d); d50.push(ac50.toFixed(1)); d100.push(ac100.toFixed(1));
            }
            chartEvol = new Chart(evolCtx.getContext('2d'), {
                type: 'line',
                data: { labels: labels, datasets: [{ label: '50% (Acum.)', data: d50, borderColor: '#39C6FF', tension: 0.3 }, { label: '100% (Acum.)', data: d100, borderColor: '#7B2EFF', tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function salvar() { localStorage.setItem('folhaPonto', JSON.stringify({ registros, jornadaDiaria, valorHoraNormal })); mostrarToast('✅ Dados guardados!'); }
        
        function validarEAtualizar(chave, campo, input) {
            let v = input.value, f = v.replace(/\D/g, ''); 
            if (f.length > 4) f = f.slice(0,4);
            if (f.length >= 3) f = f.slice(0,2) + ':' + f.slice(2);
            if (f !== input.value) input.value = f;
            if (!registros[chave]) registros[chave] = {}; 
            registros[chave][campo] = f;
            const dNum = parseInt(chave.split('-')[2]);
            const semNum = new Date(ano, mes, dNum).getDay();
            const st = calcularValoresDia(chave, semNum, mes, dNum, ano);
            const tr = input.closest('tr');
            if (tr) {
                tr.querySelector('.col-total').innerText = minToHora(st.trab);
                tr.querySelector('.col-normal').innerText = minToHora(st.normal);
                tr.querySelector('.col-e50').innerText = minToHora(st.extra50);
                tr.querySelector('.col-e100').innerText = minToHora(st.extra100);
            }
            recalcularTotais();
            const tfoot = document.querySelector('tfoot');
            if (tfoot) {
                tfoot.querySelector('.tot-trab').innerText = minToHora(cacheTotais.trab);
                tfoot.querySelector('.tot-normal').innerText = minToHora(cacheTotais.normal);
                tfoot.querySelector('.tot-e50').innerText = minToHora(cacheTotais.extra50);
                tfoot.querySelector('.tot-e100').innerText = minToHora(cacheTotais.extra100);
            }
        }

        function mudarMes(delta) { mes += delta; if (mes<0){mes=11;ano--;} if (mes>11){mes=0;ano++;} recalcularTotais(); renderizar(); if (abaAtiva === 'dashboard') setTimeout(initCharts, 50); }
        function mostrarToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
        function configJornada() { const v = prompt("Jornada Diária (horas):", (jornadaDiaria/60)); if (v && !isNaN(v)) { jornadaDiaria = Math.round(parseFloat(v) * 60); recalcularTotais(); renderizar(); salvar(); } }
        function configHora() { const v = prompt("Valor da Hora (R$):", valorHoraNormal.toFixed(2)); if (v && !isNaN(v)) { valorHoraNormal = parseFloat(v); recalcularTotais(); renderizar(); salvar(); } }
        function mudarAba(nova) { abaAtiva = nova; renderizar(); if (nova === 'dashboard') setTimeout(initCharts, 100); }

        function renderizar() {
            let corpo = '';
            const td = diasNoMes(ano, mes);

            if (abaAtiva === 'dashboard') {
                corpo = `<div class="dashboard-layout">
                    <div class="stats-column">
                        <div class="stats-grid">
                            <div class="stat-box blue"><span class="stat-label">Normais</span><div class="stat-val">${minToHora(cacheTotais.normal)}h</div></div>
                            <div class="stat-box cyan"><span class="stat-label">Extra 50%</span><div class="stat-val">${minToHora(cacheTotais.extra50)}</div><div class="stat-money">R$ ${(cacheTotais.extra50/60 * valorHoraNormal * 1.5).toFixed(2)}</div></div>
                            <div class="stat-box purple"><span class="stat-label">Extra 100%</span><div class="stat-val">${minToHora(cacheTotais.extra100)}</div><div class="stat-money">R$ ${(cacheTotais.extra100/60 * valorHoraNormal * 2).toFixed(2)}</div></div>
                            <div class="stat-box"><span class="stat-label">Total</span><div class="stat-val">${minToHora(cacheTotais.trab)}h</div></div>
                        </div>
                        <div class="chart-card" style="height: 200px;"><canvas id="chartDist"></canvas></div>
                    </div>
                    <div class="chart-card" style="height: 350px;"><canvas id="chartEvol"></canvas></div>
                </div>`;
            } else {
                let rows = '';
                for (let d = 1; d <= td; d++) {
                    const dt = new Date(ano, mes, d), sem = dt.getDay(), k = `${ano}-${mes}-${d}`, st = calcularValoresDia(k, sem, mes, d, ano), fer = isFeriado(mes, d, ano);
                    const reg = registros[k] || {};
                    rows += `<tr class="${sem === 0 ? 'weekend-sun' : (sem === 6 ? 'weekend-sat' : 'weekday')}">
                        <td style="font-weight:800">${d.toString().padStart(2,'0')}/${(mes+1).toString().padStart(2,'0')}</td>
                        <td style="color:${sem===0?'#7B2EFF':(sem===6?'#39C6FF':'#94a3b8')}">${diasNomes[sem]}${fer?' ('+fer+')':''}</td>
                        <td><input type="text" inputmode="numeric" id="in_${k}_ent1" value="${reg.ent1||''}" oninput="validarEAtualizar('${k}','ent1',this)"></td>
                        <td><input type="text" inputmode="numeric" id="in_${k}_sai1" value="${reg.sai1||''}" oninput="validarEAtualizar('${k}','sai1',this)"></td>
                        <td><input type="text" inputmode="numeric" id="in_${k}_ent2" value="${reg.ent2||''}" oninput="validarEAtualizar('${k}','ent2',this)"></td>
                        <td><input type="text" inputmode="numeric" id="in_${k}_sai2" value="${reg.sai2||''}" oninput="validarEAtualizar('${k}','sai2',this)"></td>
                        <td class="col-total" style="font-weight:900">${minToHora(st.trab)}</td>
                        <td class="col-normal" style="color:#39C6FF">${minToHora(st.normal)}</td>
                        <td class="col-e50" style="color:#C77DFF">${minToHora(st.extra50)}</td>
                        <td class="col-e100" style="color:#7B2EFF">${minToHora(st.extra100)}</td>
                    </tr>`;
                }
                corpo = `
                <div class="table-container"><div class="scroll-area"><table><thead><tr><th>Data</th><th>Dia</th><th>E1</th><th>S1</th><th>E2</th><th>S2</th><th>Total</th><th>Normal</th><th>50%</th><th>100%</th></tr></thead><tbody>${rows}</tbody>
                <tfoot style="background: rgba(57, 198, 255, 0.1); font-weight: bold;">
                    <tr>
                        <td colspan="6" style="text-align: right; padding-right: 15px;">TOTAIS</td>
                        <td class="tot-trab">${minToHora(cacheTotais.trab)}</td>
                        <td class="tot-normal" style="color:#39C6FF">${minToHora(cacheTotais.normal)}</td>
                        <td class="tot-e50" style="color:#C77DFF">${minToHora(cacheTotais.extra50)}</td>
                        <td class="tot-e100" style="color:#7B2EFF">${minToHora(cacheTotais.extra100)}</td>
                    </tr>
                </tfoot>
                </table></div></div>`;
            }

            document.getElementById('app').innerHTML = `<div class="container">
                <header class="header-card">
                    <div class="brand-section">
                        <div class="futuristic-logo">
                            <svg viewBox="0 0 1024 620" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <defs>
                                <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#39C6FF"/><stop offset="100%" stop-color="#2E5BFF"/></linearGradient>
                                <linearGradient id="neonPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C77DFF"/><stop offset="100%" stop-color="#7B2EFF"/></linearGradient>
                                <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3ACDFF"/><stop offset="100%" stop-color="#B15CFF"/></linearGradient>
                                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                                  <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
                                  <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                                </filter>
                              </defs>
                              <circle cx="512" cy="310" r="220" stroke="url(#neonBlue)" stroke-width="26" fill="none" filter="url(#glow)" stroke-dasharray="1200" stroke-dashoffset="140"/>
                              <path d="M680 120 A220 220 0 0 1 785 280" stroke="url(#neonPurple)" stroke-width="30" fill="none" stroke-linecap="round" filter="url(#glow)"/>
                              <path d="M430 315 L505 390 L675 230" stroke="url(#textGradient)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
                              <rect x="500" y="120" width="14" height="42" rx="7" fill="#46CFFF" filter="url(#glow)"/>
                              <rect x="500" y="458" width="14" height="42" rx="7" fill="#46CFFF" filter="url(#glow)"/>
                              <rect x="328" y="292" width="42" height="14" rx="7" fill="#46CFFF" filter="url(#glow)"/>
