<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Check Ponto v2.6 - Premium Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #050816 0%, #0B1026 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 12px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-card {
            background: rgba(11, 16, 38, 0.65);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .futuristic-logo {
            width: 80px;
            height: 80px;
        }

        .brand-section h1 {
            margin: 0;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .version-tag {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 6px;
        }

        button {
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-config, .btn-nav {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .date-display {
            font-weight: 800;
            font-size: 1rem;
            min-width: 140px;
            text-align: center;
        }

        .chart-card, .stat-box, .table-container {
            background: rgba(20, 25, 55, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 22px;
            padding: 20px;
        }

        .stat-box {
            border-bottom: 4px solid rgba(255,255,255,0.1);
        }
        .stat-box.blue { border-bottom-color: #39C6FF; }
        .stat-box.purple { border-bottom-color: #7B2EFF; }
        .stat-box.cyan { border-bottom-color: #C77DFF; }

        .stat-val { font-size: 1.6rem; font-weight: 900; }
        .stat-label { color: #94a3b8; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .stat-money { font-size: 0.7rem; color: #10b981; font-weight: 700; margin-top: 4px; }

        .table-container { padding: 0; overflow: hidden; }
        .scroll-area { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        
        th {
            background: rgba(57, 198, 255, 0.1);
            padding: 12px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; }

        input {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            color: white;
            width: 70px;
            padding: 6px;
            text-align: center;
            border-radius: 8px;
        }

        input:focus {
            outline: none;
            border-color: #39C6FF;
        }

        .tabs-nav {
            display: flex;
            background: rgba(255,255,255,.03);
            padding: 5px;
            border-radius: 14px;
            gap: 5px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            background: transparent;
            color: #64748b;
        }

        .tab-btn.active {
            background: rgba(57, 198, 255, 0.15);
            color: white;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .date-stepper {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 2px;
        }

        .footer {
            padding: 30px 8px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,.06);
            margin-top: 30px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
            font-weight: 700;
        }

        @media (max-width: 992px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .header-card { flex-direction: column; text-align: center; }
            .brand-section { justify-content: center; }
            .controls-area { align-items: center; width: 100%; }
            .date-controls { justify-content: center; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    (function() {
        let jornadaDiaria = 480;
        let valorHoraNormal = 10.32;
        
        const feriadosFixos = {
            '0-1': 'Ano Novo',
            '3-21': 'Tiradentes',
            '4-1': 'Dia do Trabalho',
            '8-7': 'Independência',
            '9-12': 'N. Sra Aparecida',
            '10-2': 'Finados',
            '10-15': 'Proclamação',
            '10-20': 'Consc. Negra',
            '11-25': 'Natal'
        };
        
        function calcularPascoa(ano) {
            const a = ano % 19;
            const b = Math.floor(ano / 100);
            const c = ano % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mes = Math.floor((h + l - 7 * m + 114) / 31);
            const dia = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(ano, mes - 1, dia);
        }
        
        function getFeriadosMoveis(ano) {
            const p = calcularPascoa(ano);
            const c = new Date(p);
            c.setDate(p.getDate() - 47);
            const s = new Date(p);
            s.setDate(p.getDate() - 2);
            const cc = new Date(p);
            cc.setDate(p.getDate() + 60);
            return {
                [c.getMonth() + '-' + c.getDate()]: 'Carnaval',
                [s.getMonth() + '-' + s.getDate()]: 'Sexta-Feira Santa',
                [cc.getMonth() + '-' + cc.getDate()]: 'Corpus Christi'
            };
        }
        
        function isFeriado(mes, dia, ano) {
            const chave = mes + '-' + dia;
            const moveis = getFeriadosMoveis(ano);
            return feriadosFixos[chave] || moveis[chave] || null;
        }
        
        function diasNoMes(ano, mes) {
            return new Date(ano, mes + 1, 0).getDate();
        }
        
        function horaToMin(h) {
            if (!h || !h.includes(':')) return 0;
            const [hr, mn] = h.split(':').map(Number);
            return (isNaN(hr) || isNaN(mn)) ? 0 : hr * 60 + mn;
        }
        
        function minToHora(min) {
            const h = Math.floor(min / 60);
            const m = min % 60;
            return h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0');
        }
        
        let ano = new Date().getFullYear();
        let mes = new Date().getMonth();
        let registros = {};
        let abaAtiva = 'lancamentos';
        let cacheTotais = { trab: 0, normal: 0, extra50: 0, extra100: 0 };
        let chartDist = null;
        let chartEvol = null;
        
        const salvo = localStorage.getItem('folhaPonto');
        if (salvo) {
            try {
                const p = JSON.parse(salvo);
                registros = p.registros || {};
                jornadaDiaria = p.jornadaDiaria || 480;
                valorHoraNormal = p.valorHoraNormal || 10.32;
            } catch(e) {}
        }
        
        const mesesNomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const diasNomes = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        
        function calcularValoresDia(chave, semNum, mesNum, diaNum, anoNum) {
            const d = registros[chave] || {};
            const e1 = horaToMin(d.ent1);
            const s1 = horaToMin(d.sai1);
            const e2 = horaToMin(d.ent2);
            const s2 = horaToMin(d.sai2);
            
            let trab = 0;
            if (s1 > e1) trab += s1 - e1;
            if (s2 > e2) trab += s2 - e2;
            
            let normal = 0, e50 = 0, e100 = 0;
            const feriado = isFeriado(mesNum, diaNum, anoNum);
            
            if (semNum === 0 || feriado) {
                e100 = trab;
            } else if (semNum === 6) {
                normal = Math.min(trab, 480);
                e50 = Math.max(0, trab - 480);
            } else {
                normal = Math.min(trab, jornadaDiaria);
                e50 = Math.max(0, trab - jornadaDiaria);
            }
            
            return { trab, normal, extra50: e50, extra100: e100 };
        }
        
        function recalcularTotais() {
            let n = { trab: 0, normal: 0, extra50: 0, extra100: 0 };
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(ano + '-' + mes + '-' + d, new Date(ano, mes, d).getDay(), mes, d, ano);
                n.trab += s.trab;
                n.normal += s.normal;
                n.extra50 += s.extra50;
                n.extra100 += s.extra100;
            }
            cacheTotais = n;
            return n;
        }
        
        function initCharts() {
            if (abaAtiva !== 'dashboard') return;
            
            const distCtx = document.getElementById('chartDist');
            const evolCtx = document.getElementById('chartEvol');
            if (!distCtx || !evolCtx) return;
            
            if (chartDist) chartDist.destroy();
            if (chartEvol) chartEvol.destroy();
            
            chartDist = new Chart(distCtx, {
                type: 'bar',
                data: {
                    labels: ['Normal', 'Extra 50%', 'Extra 100%'],
                    datasets: [{
                        data: [cacheTotais.normal / 60, cacheTotais.extra50 / 60, cacheTotais.extra100 / 60],
                        backgroundColor: ['#39C6FF', '#C77DFF', '#7B2EFF'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
            
            let labels = [], d50 = [], d100 = [], ac50 = 0, ac100 = 0;
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(ano + '-' + mes + '-' + d, new Date(ano, mes, d).getDay(), mes, d, ano);
                ac50 += s.extra50 / 60;
                ac100 += s.extra100 / 60;
                labels.push(d);
                d50.push(ac50.toFixed(1));
                d100.push(ac100.toFixed(1));
            }
            
            chartEvol = new Chart(evolCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Extra 50% (Acum.)', data: d50, borderColor: '#39C6FF', tension: 0.3, fill: false },
                        { label: 'Extra 100% (Acum.)', data: d100, borderColor: '#7B2EFF', tension: 0.3, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
        
        function salvar() {
            localStorage.setItem('folhaPonto', JSON.stringify({ registros, jornadaDiaria, valorHoraNormal }));
            mostrarToast('Dados salvos com sucesso!');
        }
        
        function validarEAtualizar(chave, campo, input) {
            let v = input.value;
            let f = v.replace(/\D/g, '');
            if (f.length > 4) f = f.slice(0, 4);
            if (f.length >= 3) f = f.slice(0, 2) + ':' + f.slice(2);
            if (f !== input.value) input.value = f;
            
            if (!registros[chave]) registros[chave] = {};
            registros[chave][campo] = f;
            
            const dNum = parseInt(chave.split('-')[2]);
            const semNum = new Date(ano, mes, dNum).getDay();
            const st = calcularValoresDia(chave, semNum, mes, dNum, ano);
            
            const tr = input.closest('tr');
            if (tr) {
                tr.querySelector('.col-total').innerText = minToHora(st.trab);
                tr.querySelector('.col-normal').innerText = minToHora(st.normal);
                tr.querySelector('.col-e50').innerText = minToHora(st.extra50);
                tr.querySelector('.col-e100').innerText = minToHora(st.extra100);
            }
            
            recalcularTotais();
            
            const tfoot = document.querySelector('tfoot');
            if (tfoot) {
                tfoot.querySelector('.tot-trab').innerText = minToHora(cacheTotais.trab);
                tfoot.querySelector('.tot-normal').innerText = minToHora(cacheTotais.normal);
                tfoot.querySelector('.tot-e50').innerText = minToHora(cacheTotais.extra50);
                tfoot.querySelector('.tot-e100').innerText = minToHora(cacheTotais.extra100);
            }
        }
        
        function mudarMes(delta) {
            mes += delta;
            if (mes < 0) { mes = 11; ano--; }
            if (mes > 11) { mes = 0; ano++; }
            recalcularTotais();
            renderizar();
            if (abaAtiva === 'dashboard') setTimeout(initCharts, 50);
        }
        
        function mostrarToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = '✅ ' + msg;
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 2500);
        }
        
        function configJornada() {
            const v = prompt('Jornada Diária (horas):', (jornadaDiaria / 60).toFixed(1));
            if (v && !isNaN(v) && parseFloat(v) > 0) {
                jornadaDiaria = Math.round(parseFloat(v) * 60);
                recalcularTotais();
                renderizar();
                salvar();
            }
        }
        
        function configHora() {
            const v = prompt('Valor da Hora (R$):', valorHoraNormal.toFixed(2));
            if (v && !isNaN(v) && parseFloat(v) > 0) {
                valorHoraNormal = parseFloat(v);
                recalcularTotais();
                renderizar();
                salvar();
            }
        }
        
        function mudarAba(nova) {
            abaAtiva = nova;
            renderizar();
            if (nova === 'dashboard') setTimeout(initCharts, 100);
        }
        
        function exportarPDF() {
            mostrarToast('Gerando PDF...');
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                
                doc.setFontSize(18);
                doc.setTextColor(0, 0, 0);
                doc.setFont('helvetica', 'bold');
                doc.text('RELATÓRIO DE PONTO ELETRÔNICO', 105, 20, { align: 'center' });
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.text('Mês/Ano: ' + mesesNomes[mes] + ' ' + ano, 105, 32, { align: 'center' });
                doc.text('Jornada Diária: ' + Math.floor(jornadaDiaria / 60) + ' horas', 105, 40, { align: 'center' });
                doc.text('Valor da Hora: R$ ' + valorHoraNormal.toFixed(2), 105, 48, { align: 'center' });
                
                const td = diasNoMes(ano, mes);
                let dadosTabela = [];
                
                for (let d = 1; d <= td; d++) {
                    const dt = new Date(ano, mes, d);
                    const sem = dt.getDay();
                    const k = ano + '-' + mes + '-' + d;
                    const st = calcularValoresDia(k, sem, mes, d, ano);
                    const reg = registros[k] || {};
                    const fer = isFeriado(mes, d, ano);
                    let diaNome = diasNomes[sem];
                    if (fer) diaNome = diaNome + ' (' + fer + ')';
                    const dataStr = d.toString().padStart(2, '0') + '/' + (mes + 1).toString().padStart(2, '0');
                    
                    dadosTabela.push([
                        dataStr, diaNome.substring(0, 18),
                        reg.ent1 || '--:--', reg.sai1 || '--:--',
                        reg.ent2 || '--:--', reg.sai2 || '--:--',
                        minToHora(st.trab), minToHora(st.normal),
                        minToHora(st.extra50), minToHora(st.extra100)
                    ]);
                }
                
                dadosTabela.push([
                    'TOTAIS', '', '', '', '', '',
                    minToHora(cacheTotais.trab),
                    minToHora(cacheTotais.normal),
                    minToHora(cacheTotais.extra50),
                    minToHora(cacheTotais.extra100)
                ]);
                
                doc.autoTable({
                    head: [['Data', 'Dia', 'E1', 'S1', 'E2', 'S2', 'Total', 'Normal', '50%', '100%']],
                    body: dadosTabela,
                    startY: 55,
                    theme: 'grid',
                    headStyles: { fillColor: [60, 60, 60], textColor: [255, 255, 255], fontStyle: 'bold' },
                    bodyStyles: { textColor: [0, 0, 0] },
                    alternateRowStyles: { fillColor: [245, 245, 245] },
                    styles: { fontSize: 8, cellPadding: 2 }
                });
                
                let finalY = doc.lastAutoTable.finalY + 10;
                
                const valorNormal = (cacheTotais.normal / 60) * valorHoraNormal;
                const valorExtra50 = (cacheTotais.extra50 / 60) * valorHoraNormal * 1.5;
                const valorExtra100 = (cacheTotais.extra100 / 60) * valorHoraNormal * 2;
                const valorTotal = valorNormal + valorExtra50 + valorExtra100;
                
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.text('RESUMO FINANCEIRO', 105, finalY, { align: 'center' });
                finalY += 10;
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.text('Horas Normais: ' + minToHora(cacheTotais.normal) + 'h = R$ ' + valorNormal.toFixed(2), 20, finalY);
                finalY += 7;
                doc.text('Horas Extras 50%: ' + minToHora(cacheTotais.extra50) + 'h = R$ ' + valorExtra50.toFixed(2), 20, finalY);
                finalY += 7;
                doc.text('Horas Extras 100%: ' + minToHora(cacheTotais.extra100) + 'h = R$ ' + valorExtra100.toFixed(2), 20, finalY);
                finalY += 10;
                
                doc.setFont('helvetica', 'bold');
                doc.text('VALOR TOTAL DO MÊS: R$ ' + valorTotal.toFixed(2), 20, finalY);
                
                const nomeArquivo = 'Relatorio_Ponto_' + mesesNomes[mes] + '_' + ano + '.pdf';
                doc.save(nomeArquivo);
                mostrarToast('PDF salvo com sucesso!');
                
            } catch (error) {
                console.error('Erro:', error);
                mostrarToast('Erro ao gerar PDF');
            }
        }
        
        function renderizar() {
            let corpo = '';
            const td = diasNoMes(ano, mes);
            
            if (abaAtiva === 'dashboard') {
                const valorExtra50Reais = (cacheTotais.extra50 / 60) * valorHoraNormal * 1.5;
                const valorExtra100Reais = (cacheTotais.extra100 / 60) * valorHoraNormal * 2;
                
                corpo = `
                    <div class="dashboard-layout">
                        <div class="stats-column">
                            <div class="stats-grid">
                                <div class="stat-box blue">
                                    <div class="stat-label">HORAS NORMAIS</div>
                                    <div class="stat-val">${minToHora(cacheTotais.normal)}h</div>
                                    <div class="stat-money">R$ ${((cacheTotais.normal/60) * valorHoraNormal).toFixed(2)}</div>
                                </div>
                                <div class="stat-box cyan">
                                    <div class="stat-label">EXTRA 50%</div>
                                    <div class="stat-val">${minToHora(cacheTotais.extra50)}h</div>
                                    <div class="stat-money">R$ ${valorExtra50Reais.toFixed(2)}</div>
                                </div>
                                <div class="stat-box purple">
                                    <div class="stat-label">EXTRA 100%</div>
                                    <div class="stat-val">${minToHora(cacheTotais.extra100)}h</div>
                                    <div class="stat-money">R$ ${valorExtra100Reais.toFixed(2)}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">TOTAL</div>
                                    <div class="stat-val">${minToHora(cacheTotais.trab)}h</div>
                                    <div class="stat-money">R$ ${((cacheTotais.normal/60) * valorHoraNormal + valorExtra50Reais + valorExtra100Reais).toFixed(2)}</div>
                                </div>
                            </div>
                            <div class="chart-card" style="height: 220px;">
                                <canvas id="chartDist"></canvas>
                            </div>
                        </div>
                        <div class="chart-card" style="height: 380px;">
                            <canvas id="chartEvol"></canvas>
                        </div>
                    </div>
                `;
            } else {
                let rows = '';
                for (let d = 1; d <= td; d++) {
                    const dt = new Date(ano, mes, d);
                    const sem = dt.getDay();
                    const k = ano + '-' + mes + '-' + d;
                    const st = calcularValoresDia(k, sem, mes, d, ano);
                    const reg = registros[k] || {};
                    const fer = isFeriado(mes, d, ano);
                    const isSunday = sem === 0;
                    const isSaturday = sem === 6;
                    
                    let diaTexto = diasNomes[sem];
                    if (fer) diaTexto = diaTexto + ' (' + fer + ')';
                    
                    rows += `
                        <tr style="${isSunday ? 'background: rgba(123, 46, 255, 0.1);' : (isSaturday ? 'background: rgba(57, 198, 255, 0.05);' : '')}">
                            <td style="font-weight:800">${d.toString().padStart(2,'0')}/${(mes+1).toString().padStart(2,'0')}</td>
                            <td style="color:${isSunday?'#7B2EFF':(isSaturday?'#39C6FF':'#94a3b8')}">${diaTexto}</td>
                            <td><input type="text" inputmode="numeric" id="in_${k}_ent1" value="${reg.ent1||''}" oninput="validarEAtualizar('${k}','ent1',this)" placeholder="--:--"></td>
                            <td><input type="text" inputmode="numeric" id="in_${k}_sai1" value="${reg.sai1||''}" oninput="validarEAtualizar('${k}','sai1',this)" placeholder="--:--"></td>
                            <td><input type="text" inputmode="numeric" id="in_${k}_ent2" value="${reg.ent2||''}" oninput="validarEAtualizar('${k}','ent2',this)" placeholder="--:--"></td>
                            <td><input type="text" inputmode="numeric" id="in_${k}_sai2" value="${reg.sai2||''}" oninput="validarEAtualizar('${k}','sai2',this)" placeholder="--:--"></td>
                            <td class="col-total" style="font-weight:900">${minToHora(st.trab)}</td>
                            <td class="col-normal" style="color:#39C6FF">${minToHora(st.normal)}</td>
                            <td class="col-e50" style="color:#C77DFF">${minToHora(st.extra50)}</td>
                            <td class="col-e100" style="color:#7B2EFF">${minToHora(st.extra100)}</td>
                        </tr>
                    `;
                }
                
                corpo = `
                    <div class="table-container">
                        <div class="scroll-area">
                            <table>
                                <thead>
                                    <tr><th>Data</th><th>Dia</th><th>E1</th><th>S1</th><th>E2</th><th>S2</th><th>Total</th><th>Normal</th><th>50%</th><th>100%</th></tr>
                                </thead>
                                <tbody>${rows}</tbody>
                                <tfoot style="background: rgba(57, 198, 255, 0.1); font-weight: bold;">
                                    <tr>
                                        <td colspan="6" style="text-align: right;">TOTAIS</td>
                                        <td class="tot-trab">${minToHora(cacheTotais.trab)}</td>
                                        <td class="tot-normal" style="color:#39C6FF">${minToHora(cacheTotais.normal)}</td>
                                        <td class="tot-e50" style="color:#C77DFF">${minToHora(cacheTotais.extra50)}</td>
                                        <td class="tot-e100" style="color:#7B2EFF">${minToHora(cacheTotais.extra100)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <header class="header-card">
                        <div class="brand-section">
                            <div class="futuristic-logo">
                                <svg viewBox="0 0 1024 620" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="512" cy="310" r="220" stroke="#39C6FF" stroke-width="26" fill="none" stroke-dasharray="1200" stroke-dashoffset="140"/>
                                    <path d="M680 120 A220 220 0 0 1 785 280" stroke="#7B2EFF" stroke-width="30" fill="none" stroke-linecap="round"/>
                                    <path d="M430 315 L505 390 L675 230" stroke="url(#textGradient)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                                </svg>
                            </div>
                            <div class="brand-info">
                                <h1>Check Ponto <span class="version-tag">v2.6</span></h1>
                                <div style="font-size:0.65rem;color:rgba(58,205,255,0.6);">Jornada: ${Math.floor(jornadaDiaria/60)}h | Valor: R$ ${valorHoraNormal.toFixed(2)}/h</div>
                            </div>
                        </div>
                        <div class="controls-area">
                            <div class="date-controls">
                                <div class="date-stepper">
                                    <button class="btn-nav" onclick="mudarMes(-1)">◀</button>
                                    <div class="date-display">${mesesNomes[mes]} ${ano}</div>
                                    <button class="btn-nav" onclick="mudarMes(1)">▶</button>
                                </div>
                                <button class="btn-primary" onclick="salvar()">💾 SALVAR</button>
                                <button class="btn-secondary" onclick="exportarPDF()">📄 PDF</button>
                            </div>
                            <div>
                                <button class="btn-config" onclick="configJornada()">⚙️ Jornada</button>
                                <button class="btn-config" onclick="configHora()">💰 Valor Hora</button>
                            </div>
                        </div>
                    </header>
                    
                    <nav class="tabs-nav">
                        <button class="tab-btn ${abaAtiva === 'dashboard' ? 'active' : ''}" onclick="mudarAba('dashboard')">📊 DASHBOARD</button>
                        <button class="tab-btn ${abaAtiva === 'lancamentos' ? 'active' : ''}" onclick="mudarAba('lancamentos')">✍️ LANÇAMENTOS</button>
                    </nav>
                    
                    ${corpo}
                    
                    <footer class="footer">
                        <div>Check Ponto v2.6 • Sistema de Controle de Ponto Eletrônico</div>
                        <div style="font-size:0.65rem; opacity:0.5; margin-top:8px;">Criado por Deh Januário</div>
                    </footer>
                </div>
                <div id="toast" class="toast"></div>
            `;
        }
        
        window.validarEAtualizar = validarEAtualizar;
        window.mudarMes = mudarMes;
        window.salvar = salvar;
        window.configJornada = configJornada;
        window.configHora = configHora;
        window.mudarAba = mudarAba;
        window.exportarPDF = exportarPDF;
        
        recalcularTotais();
        renderizar();
        if (abaAtiva === 'dashboard') setTimeout(initCharts, 100);
    })();
</script>
</body>
</html>
