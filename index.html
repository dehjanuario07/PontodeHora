<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Check Ponto v2.9 - Premium Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #39C6FF;
            --secondary: #7B2EFF;
            --accent: #C77DFF;
            --radius: 22px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background:
                radial-gradient(circle at top left, rgba(58, 205, 255, 0.15), transparent 28%),
                radial-gradient(circle at bottom right, rgba(177, 92, 255, 0.18), transparent 30%),
                linear-gradient(135deg,#050816 0%, #0B1026 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            opacity: .35;
            z-index: 0;
        }

        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

        /* HEADER ORGANIZADO EM 4 LINHAS */
        .header-card {
            background: rgba(11, 16, 38, 0.65) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 198, 255, 0.02), rgba(255, 255, 255, 0.15), rgba(57, 198, 255, 0.02), transparent);
            animation: shineSweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
        }

        @keyframes shineSweep { 0% { left: -150%; } 40%, 100% { left: 150%; } }

        /* ESTRUTURA DE LINHAS DO CABEÇALHO */
        .header-row-1 { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
        .header-row-2 { display: flex; align-items: center; justify-content: center; width: 100%; }
        .header-row-3 { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; flex-wrap: wrap; }
        .header-row-4 { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }

        .futuristic-logo {
            width: 55px; height: 55px; 
            filter: drop-shadow(0 0 12px rgba(57, 198, 255, 0.4));
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); filter: brightness(1.2); }
        }

        .brand-title {
            margin: 0; font-size: 1.6rem; font-weight: 800;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .version-tag {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 6px;
            font-weight: 700; margin-left: 6px; vertical-align: middle;
        }

        .date-stepper {
            display: flex; align-items: center; background: rgba(255,255,255,0.04);
            border-radius: 14px; padding: 4px; border: 1px solid rgba(255,255,255,0.08);
        }

        .date-display {
            font-weight: 800; font-size: 1rem; min-width: 140px;
            text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-config {
            background: rgba(255,255,255,0.06); color: #39C6FF; border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.75rem; padding: 8px 15px; text-transform: uppercase; border-radius: 10px;
        }

        button {
            padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none;
            font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; transition: all .2s ease;
            white-space: nowrap;
        }

        .btn-primary { background: linear-gradient(135deg, #39C6FF, #7B2EFF); color: white; box-shadow: 0 5px 15px rgba(57, 198, 255, 0.3); }
        .btn-pdf { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-nav { background: transparent; color: var(--primary); font-size: 1.2rem; padding: 5px 15px; }

        /* DASHBOARD & STATS */
        .chart-card, .stat-box, .table-container {
            background: rgba(20, 25, 55, 0.7); backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius);
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-box { border-bottom: 4px solid rgba(255,255,255,0.1); }
        .stat-box.blue { border-bottom-color: #39C6FF; }
        .stat-box.purple { border-bottom-color: #7B2EFF; }
        .stat-val { font-size: 1.6rem; font-weight: 900; }
        .stat-label { color: #94a3b8; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .stat-money { font-size: 0.85rem; color: #10b981; font-weight: 800; margin-top: 4px; }

        /* TABELAS */
        .table-container { padding: 0; overflow: hidden; margin-bottom: 24px; }
        .scroll-area { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: rgba(57, 198, 255, 0.1); padding: 14px; font-size: 0.75rem; text-transform: uppercase; font-weight: 800; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; }

        .weekend-sat { background: rgba(57, 198, 255, 0.04); }
        .weekend-sun { background: rgba(123, 46, 255, 0.05); }

        input {
            background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: white;
            width: 70px; padding: 6px 2px; text-align: center; font-weight: 700; border-radius: 8px;
        }

        .tabs-nav { display: flex; background: rgba(255,255,255,.03); padding: 5px; border-radius: 14px; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; background: transparent; color: #64748b; }
        .tab-btn.active { background: rgba(57, 198, 255, 0.15); color: white; }

        .dashboard-layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }

        /* RODAPÉ PREMIUM v2.9 */
        .footer { padding: 40px 20px; text-align: center; margin-top: 50px; position: relative; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .footer-content {
            background: rgba(20, 25, 55, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: inline-block; padding: 15px 40px; border-radius: 50px;
            border: 1px solid rgba(58, 205, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(58, 205, 255, 0.1);
        }
        .footer-text { color: #94a3b8; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.5px; }
        .footer-text b { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .footer-brand {
            display: block; margin-top: 5px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #39C6FF, #7B2EFF); color: white;
            padding: 12px 30px; border-radius: 50px; display: none; z-index: 1000; font-weight: 700;
        }

        @media (max-width: 768px) {
            .brand-title { font-size: 1.3rem; }
            .header-row-3 { flex-direction: column; width: 100%; }
            .btn-config { width: 100%; }
            .dashboard-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    (function() {
        let jornadaDiaria = 480; 
        let valorHoraNormal = 10.32; 
        const feriadosFixos = { '0-1': 'Ano Novo', '3-21': 'Tiradentes', '4-1': 'Dia do Trabalho', '8-7': 'Independência', '9-12': 'N. Sra Aparecida', '10-2': 'Finados', '10-15': 'Proclamação', '10-20': 'Consc. Negra', '11-25': 'Natal' };
        
        function calcularPascoa(ano) {
            const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(ano, mes - 1, dia);
        }
        function getFeriadosMoveis(ano) {
            const p = calcularPascoa(ano), c = new Date(p); c.setDate(p.getDate() - 47); const s = new Date(p); s.setDate(p.getDate() - 2); const cc = new Date(p); cc.setDate(p.getDate() + 60);
            return { [`${c.getMonth()}-${c.getDate()}`]: 'Carnaval', [`${s.getMonth()}-${s.getDate()}`]: 'Sexta-Feira Santa', [`${cc.getMonth()}-${cc.getDate()}`]: 'Corpus Christi' };
        }
        function isFeriado(mes, dia, ano) { const chave = `${mes}-${dia}`, moveis = getFeriadosMoveis(ano); return feriadosFixos[chave] || moveis[chave] || null; }
        function diasNoMes(ano, mes) { return new Date(ano, mes + 1, 0).getDate(); }
        function horaToMin(h) { if (!h || !h.includes(':')) return 0; const [hr, mn] = h.split(':').map(Number); return hr * 60 + mn; }
        function minToHora(min) { const absMin = Math.abs(min); const h = Math.floor(absMin / 60), m = absMin % 60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`; }

        let ano = new Date().getFullYear();
        let mes = new Date().getMonth();
        let registros = {};
        let abaAtiva = 'lancamentos'; 
        let cacheTotais = { trab:0, normal:0, extra50:0, extra100:0 };
        let chartDist = null, chartEvol = null;

        const salvo = localStorage.getItem('folhaPonto_v2.9');
        if (salvo) { try { const p = JSON.parse(salvo); registros = p.registros || {}; jornadaDiaria = p.jornadaDiaria || 480; valorHoraNormal = p.valorHoraNormal || 10.32; } catch(e) {} }
        
        const mesesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const diasNomes = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

        function calcularValoresDia(chave, semNum, mesNum, diaNum, anoNum) {
            const d = registros[chave] || {};
            const e1 = horaToMin(d.ent1), s1 = horaToMin(d.sai1), e2 = horaToMin(d.ent2), s2 = horaToMin(d.sai2);
            let trab = 0; 
            if (s1 > e1) trab += s1 - e1; 
            if (s2 > e2) trab += s2 - e2;
            
            let normal = 0, e50 = 0, e100 = 0;
            const feriado = isFeriado(mesNum, diaNum, anoNum);
            
            // Domingos ou Feriados (100% extra em todo o período trabalhado)
            if (semNum === 0 || feriado) {
                e100 = trab;
            } 
            // Sábados (Normal: 4h ou 240min)
            else if (semNum === 6) { 
                normal = Math.min(trab, 240); 
                let excesso = trab - 240;
                // Só considera hora extra se passar de 10 minutos
                e50 = excesso > 10 ? excesso : 0; 
            } 
            // Segunda a Sexta (Normal: 8h ou jornadaDiaria)
            else { 
                normal = Math.min(trab, jornadaDiaria); 
                let excesso = trab - jornadaDiaria;
                // Só considera hora extra se passar de 10 minutos
                e50 = excesso > 10 ? excesso : 0; 
            }
            
            return { trab, normal, extra50: e50, extra100: e100 };
        }

        function recalcularTotais() {
            let n = { trab:0, normal:0, extra50:0, extra100:0 };
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(`${ano}-${mes}-${d}`, new Date(ano, mes, d).getDay(), mes, d, ano);
                n.trab += s.trab; n.normal += s.normal; n.extra50 += s.extra50; n.extra100 += s.extra100;
            }
            cacheTotais = n; return n;
        }

        async function exportarPDF() {
            recalcularTotais(); // Garante que os totais usados no PDF são os mais recentes
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(57, 198, 255);
            doc.text("CHECK PONTO", 20, 20);

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`Relatório Oficial Premium v2.9 • Gerado em ${new Date().toLocaleDateString()}`, 20, 28);
            doc.line(20, 32, 190, 32);

            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            doc.text(`Período: ${mesesNomes[mes]} de ${ano}`, 20, 42);
            doc.text(`Jornada: ${Math.floor(jornadaDiaria/60)}h | Valor Hora: R$ ${valorHoraNormal.toFixed(2)}`, 110, 42);

            const tableBody = [];
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const k = `${ano}-${mes}-${d}`;
                const dt = new Date(ano, mes, d);
                const st = calcularValoresDia(k, dt.getDay(), mes, d, ano);
                const reg = registros[k] || {};
                tableBody.push([
                    `${d.toString().padStart(2,'0')}/${(mes+1).toString().padStart(2,'0')}`,
                    diasNomes[dt.getDay()], reg.ent1 || '-', reg.sai1 || '-', reg.ent2 || '-', reg.sai2 || '-',
                    minToHora(st.trab), minToHora(st.extra50), minToHora(st.extra100)
                ]);
            }

            // Cálculo dos saldos em dinheiro
            const val50 = (cacheTotais.extra50 / 60 * valorHoraNormal * 1.5).toFixed(2);
            const val100 = (cacheTotais.extra100 / 60 * valorHoraNormal * 2.0).toFixed(2);

            doc.autoTable({
                startY: 48,
                head: [['Data', 'Dia', 'E1', 'S1', 'E2', 'S2', 'Total', '50%', '100%']],
                body: tableBody,
                theme: 'grid',
                headStyles: { fillColor: [57, 198, 255], halign: 'center', textColor: 255 },
                styles: { fontSize: 8, halign: 'center' },
                foot: [
                    [
                        { content: 'TOTAIS (HORAS)', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold' } },
                        minToHora(cacheTotais.trab), minToHora(cacheTotais.extra50), minToHora(cacheTotais.extra100)
                    ],
                    [
                        { content: 'SALDO EM DINHEIRO (R$)', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold' } },
                        '-', `R$ ${val50}`, `R$ ${val100}`
                    ]
                ],
                footStyles: { fillColor: [240, 240, 240], textColor: 0, lineWidth: 0.1 }
            });

            doc.save(`CheckPonto_v29_${mesesNomes[mes]}_${ano}.pdf`);
            mostrarToast("📄 PDF Exportado com Saldo!");
        }

        function initCharts() {
            if (abaAtiva !== 'dashboard') return;
            const distCtx = document.getElementById('chartDist'), evolCtx = document.getElementById('chartEvol');
            if (!distCtx || !evolCtx) return;
            if (chartDist) chartDist.destroy();
            if (chartEvol) chartEvol.destroy();

            chartDist = new Chart(distCtx.getContext('2d'), {
                type: 'bar',
                data: { labels: ['Normal', '50%', '100%'], datasets: [{ data: [cacheTotais.normal/60, cacheTotais.extra50/60, cacheTotais.extra100/60], backgroundColor: ['#39C6FF', '#7B2EFF', '#C77DFF'], borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            let labels = [], d50 = [], d100 = [], ac50 = 0, ac100 = 0;
            for (let d = 1; d <= diasNoMes(ano, mes); d++) {
                const s = calcularValoresDia(`${ano}-${mes}-${d}`, new Date(ano, mes, d).getDay(), mes, d, ano);
                ac50 += s.extra50 / 60; ac100 += s.extra100 / 60;
                labels.push(d); d50.push(ac50.toFixed(1)); d100.push(ac100.toFixed(1));
            }
            chartEvol = new Chart(evolCtx.getContext('2d'), {
                type: 'line',
                data: { labels: labels, datasets: [{ label: '50%', data: d50, borderColor: '#39C6FF', tension: 0.3 }, { label: '100%', data: d100, borderColor: '#7B2EFF', tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function salvar() { localStorage.setItem('folhaPonto_v2.9', JSON.stringify({ registros, jornadaDiaria, valorHoraNormal })); mostrarToast('✅ Dados guardados!'); }
        
        function validarEAtualizar(chave, campo, input) {
            let v = input.value, f = v.replace(/\D/g, ''); 
            if (f.length > 4) f = f.slice(0,4);
            if (f.length >= 3) f = f.slice(0,2) + ':' + f.slice(2);
            if (f !== input.value) input.value = f;
            if (!registros[chave]) registros[chave] = {}; 
            registros[chave][campo] = f;
            
            recalcularTotais();
            
            const dNum = parseInt(chave.split('-')[2]);
            const st = calcularValoresDia(chave, new Date(ano, mes, dNum).getDay(), mes, dNum, ano);
            const tr = input.closest('tr');
            if (tr) {
                tr.querySelector('.col-total').innerText = minToHora(st.trab);
                tr.querySelector('.col-norm').innerText = minToHora(st.normal);
                tr.querySelector('.col-50').innerText = minToHora(st.extra50);
                tr.querySelector('.col-100').innerText = minToHora(st.extra100);
            }
            const tfoot = document.querySelector('tfoot');
            if (tfoot) {
                tfoot.querySelector('.tot-trab').innerText = minToHora(cacheTotais.trab);
                tfoot.querySelector('.tot-norm').innerText = minToHora(cacheTotais.normal);
                tfoot.querySelector('.tot-50').innerText = minToHora(cacheTotais.extra50);
                tfoot.querySelector('.tot-100').innerText = minToHora(cacheTotais.extra100);
            }
        }

        function configJornada() { 
            const v = prompt("Nova Jornada Diária em horas (ex: 8):", (jornadaDiaria/60)); 
            if (v !== null && v !== "") { 
                jornadaDiaria = Math.round(parseFloat(v.replace(',', '.')) * 60); 
                recalcularTotais(); renderizar(); salvar(); 
            } 
        }

        function configHora() { 
            const v = prompt("Novo Valor da Hora (R$):", valorHoraNormal.toFixed(2)); 
            if (v !== null && v !== "") { 
                valorHoraNormal = parseFloat(v.replace(',', '.')); 
                recalcularTotais(); renderizar(); salvar(); 
            } 
        }

        function mudarMes(delta) { mes += delta; if (mes<0){mes=11;ano--;} if (mes>11){mes=0;ano++;} recalcularTotais(); renderizar(); if (abaAtiva === 'dashboard') setTimeout(initCharts, 50); }
        function mostrarToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
        function mudarAba(nova) { abaAtiva = nova; renderizar(); if (nova === 'dashboard') setTimeout(initCharts, 100); }

        function renderizar() {
            let corpo = '';
            const td = diasNoMes(ano, mes);

            if (abaAtiva === 'dashboard') {
                corpo = `<div class="dashboard-layout">
                    <div class="stats-column">
                        <div class="stats-grid">
                            <div class="stat-box blue"><span class="stat-label">Normal</span><div class="stat-val">${minToHora(cacheTotais.normal)}h</div></div>
                            <div class="stat-box cyan"><span class="stat-label">Extra 50%</span><div class="stat-val">${minToHora(cacheTotais.extra50)}</div><div class="stat-money">R$ ${(cacheTotais.extra50/60 * valorHoraNormal * 1.5).toFixed(2)}</div></div>
                            <div class="stat-box purple"><span class="stat-label">Extra 100%</span><div class="stat-val">${minToHora(cacheTotais.extra100)}</div><div class="stat-money">R$ ${(cacheTotais.extra100/60 * valorHoraNormal * 2.0).toFixed(2)}</div></div>
                            <div class="stat-box"><span class="stat-label">Total Geral</span><div class="stat-val">${minToHora(cacheTotais.trab)}h</div></div>
                        </div>
                        <div class="chart-card" style="height: 200px;"><canvas id="chartDist"></canvas></div>
                    </div>
                    <div class="chart-card" style="height: 380px;"><canvas id="chartEvol"></canvas></div>
                </div>`;
            } else {
                let rows = '';
                for (let d = 1; d <= td; d++) {
                    const dt = new Date(ano, mes, d), sem = dt.getDay(), k = `${ano}-${mes}-${d}`, st = calcularValoresDia(k, sem, mes, d, ano), fer = isFeriado(mes, d, ano);
                    const reg = registros[k] || {};
                    let rowClass = (sem === 6) ? 'weekend-sat' : (sem === 0) ? 'weekend-sun' : 'weekday';

                    rows += `<tr class="${rowClass}">
                        <td style="font-weight:800">${d.toString().padStart(2,'0')}/${(mes+1).toString().padStart(2,'0')}</td>
                        <td style="color:${sem===0?'#7B2EFF':(sem===6?'#39C6FF':'#94a3b8')}">${diasNomes[sem]}${fer ? ' (' + fer + ')' : ''}</td>
                        <td><input type="text" inputmode="numeric" value="${reg.ent1||''}" oninput="validarEAtualizar('${k}','ent1',this)"></td>
                        <td><input type="text" inputmode="numeric" value="${reg.sai1||''}" oninput="validarEAtualizar('${k}','sai1',this)"></td>
                        <td><input type="text" inputmode="numeric" value="${reg.ent2||''}" oninput="validarEAtualizar('${k}','ent2',this)"></td>
                        <td><input type="text" inputmode="numeric" value="${reg.sai2||''}" oninput="validarEAtualizar('${k}','sai2',this)"></td>
