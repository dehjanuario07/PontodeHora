<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Check Ponto v4.6 - Ajuste Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #39C6FF;
            --secondary: #7B2EFF;
            --accent: #C77DFF;
            --radius: 22px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background:
                radial-gradient(circle at top left, rgba(58, 205, 255, 0.15), transparent 28%),
                radial-gradient(circle at bottom right, rgba(177, 92, 255, 0.18), transparent 30%),
                linear-gradient(135deg,#050816 0%, #0B1026 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            opacity: .35;
            z-index: 0;
        }

        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

        .header-card {
            background: rgba(11, 16, 38, 0.65) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 198, 255, 0.02), rgba(255, 255, 255, 0.15), rgba(57, 198, 255, 0.02), transparent);
            animation: shineSweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
        }

        @keyframes shineSweep { 0% { left: -150%; } 40%, 100% { left: 150%; } }

        .header-row-1 { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
        .header-row-2 { display: flex; align-items: center; justify-content: center; width: 100%; }
        .header-row-4 { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }

        .futuristic-logo {
            width: 55px; height: 55px; 
            filter: drop-shadow(0 0 12px rgba(57, 198, 255, 0.4));
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); filter: brightness(1.2); }
        }

        .brand-title {
            margin: 0; font-size: 1.6rem; font-weight: 800;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .version-tag {
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 6px;
            font-weight: 700; margin-left: 6px; vertical-align: middle;
        }

        .date-stepper {
            display: flex; align-items: center; background: rgba(255,255,255,0.04);
            border-radius: 14px; padding: 4px; border: 1px solid rgba(255,255,255,0.08);
        }

        .date-display {
            font-weight: 800; font-size: 1rem; min-width: 140px;
            text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 1px;
        }

        button {
            padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none;
            font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; transition: all .2s ease;
            white-space: nowrap;
        }

        .btn-primary { background: linear-gradient(135deg, #39C6FF, #7B2EFF); color: white; box-shadow: 0 5px 15px rgba(57, 198, 255, 0.3); }
        .btn-pdf { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-nav { background: transparent; color: var(--primary); font-size: 1.2rem; padding: 5px 15px; }

        .aba-card {
            background: rgba(20, 25, 55, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .aba-card .aba-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .aba-card .aba-title i {
            color: var(--primary);
            font-size: 1rem;
        }

        .stat-box { border-bottom: 4px solid rgba(255,255,255,0.1); padding: 12px 15px; border-radius: 12px; background: rgba(255,255,255,0.02); }
        .stat-box.blue { border-bottom-color: #39C6FF; }
        .stat-box.purple { border-bottom-color: #7B2EFF; }
        .stat-box.green { border-bottom-color: #10b981; }
        .stat-box.orange { border-bottom-color: #f59e0b; }
        .stat-box.pink { border-bottom-color: #ec4899; }
        .stat-val { font-size: 1.6rem; font-weight: 900; }
        .stat-label { color: #94a3b8; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .stat-money { font-size: 0.85rem; color: #10b981; font-weight: 800; margin-top: 4px; }

        .dashboard-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }

        .relatorio-wrapper { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 10px; }

        .relatorio-section {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .relatorio-section .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ec4899;
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.5px;
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(236, 72, 153, 0.15);
        }

        .relatorio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

        .relatorio-card {
            background: rgba(20, 25, 55, 0.5);
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .relatorio-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
            background: rgba(20, 25, 55, 0.7);
        }

        .relatorio-card .q-label { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.3px; }
        .relatorio-card .q-total { font-size: 1.6rem; font-weight: 900; margin: 4px 0; color: #ec4899; }
        .relatorio-card .q-money { font-size: 0.8rem; color: #10b981; font-weight: 700; margin-top: 3px; }

        .relatorio-card.r1 { border-bottom: 3px solid #39C6FF; }
        .relatorio-card.r2 { border-bottom: 3px solid #7B2EFF; }
        .relatorio-card.r3 { border-bottom: 3px solid #C77DFF; }
        .relatorio-card.r4 { border-bottom: 3px solid #f59e0b; }

        .table-container { padding: 0; overflow: hidden; }
        .scroll-area { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: rgba(57, 198, 255, 0.1); padding: 10px 8px; font-size: 0.7rem; text-transform: uppercase; font-weight: 800; white-space: nowrap; }
        td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: center; font-size: 0.8rem; }

        .weekend-sat { background: rgba(57, 198, 255, 0.04); }
        .weekend-sun { background: rgba(123, 46, 255, 0.05); }

        .hora-cell { font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
        .hora-cell.vazia { color: #475569; font-weight: 500; }

        .tabs-nav {
            display: flex;
            background: rgba(255,255,255,.03);
            padding: 6px;
            border-radius: 16px;
            gap: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.04);
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tab-btn {
            flex: 1 1 0;
            min-width: 60px;
            padding: 10px 12px;
            border-radius: 12px;
            font-weight: 700;
            background: transparent;
            color: #64748b;
            font-size: 0.7rem;
            white-space: nowrap;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .tab-btn i { display: none; }
        .tab-btn.active {
            background: rgba(57, 198, 255, 0.12);
            color: #fff;
            border-color: rgba(57, 198, 255, 0.2);
            box-shadow: 0 0 20px rgba(57, 198, 255, 0.05);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
        }

        .chart-grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
        .chart-grid-3 .chart-card-full { grid-column: 1 / -1; }
        .chart-card {
            background: rgba(20, 25, 55, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bio-container { max-width: 500px; margin: 0 auto; }
        .fingerprint-btn {
            background: rgba(57, 198, 255, 0.05);
            border: 2px solid var(--primary);
            border-radius: 50%;
            width: 120px; height: 120px;
            display: flex; justify-content: center; align-items: center;
            color: var(--primary);
            font-size: 3.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(57, 198, 255, 0.2);
            transition: all 0.3s ease;
            margin: 20px auto;
        }
        .fingerprint-btn:active { transform: scale(0.95); }
        .fingerprint-btn.pulse { animation: neonPulse 2s infinite; }
        .fingerprint-btn:disabled { 
            border-color: #475569; color: #475569; 
            box-shadow: none; animation: none; cursor: not-allowed; 
            background: rgba(255,255,255,0.02);
        }
        
        @keyframes neonPulse {
            0% { box-shadow: 0 0 0 0 rgba(57, 198, 255, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(57, 198, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 198, 255, 0); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: rgba(11, 16, 38, 0.95);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            padding: 30px; text-align: center; width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1.5s ease-in-out; }

        .punch-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px 14px;
            border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
        }
        .punch-row.filled { border-left: 4px solid var(--primary); }
        .punch-row.empty { border-left: 4px solid #475569; opacity: 0.6; }
        .punch-row span { font-size: 0.85rem; }
        .punch-row strong { font-size: 1rem; }

        .day-picker { position: relative; display: flex; align-items: stretch; gap: 8px; margin-bottom: 18px; }
        .day-picker .day-nav-btn {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.08), rgba(123, 46, 255, 0.08));
            color: var(--primary);
            border: 1px solid rgba(57, 198, 255, 0.2);
            border-radius: 14px;
            width: 52px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }
        .day-picker .day-nav-btn:hover {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.18), rgba(123, 46, 255, 0.18));
            border-color: rgba(57, 198, 255, 0.45);
            box-shadow: 0 0 20px rgba(57, 198, 255, 0.25);
        }
        .day-picker .day-nav-btn:active { transform: scale(0.95); }

        .day-picker .day-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            padding: 12px 16px;
            border-radius: 14px;
            transition: all 0.25s ease;
            position: relative;
            user-select: none;
            min-width: 0;
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.06), rgba(123, 46, 255, 0.06));
            border: 1px solid rgba(57, 198, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(57, 198, 255, 0.04), 0 4px 20px rgba(0,0,0,0.2);
        }

        .day-picker .day-center::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.35), transparent 40%, transparent 60%, rgba(199, 125, 255, 0.35));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .day-picker .day-center:hover {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.1), rgba(123, 46, 255, 0.1));
            border-color: rgba(57, 198, 255, 0.4);
        }

        .day-picker .day-center .day-number {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #3ACDFF 0%, #B15CFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            white-space: nowrap;
        }

        .day-picker .day-center .day-number small { font-size: 0.9rem; font-weight: 800; margin-left: 2px; }

        .day-picker .day-center .day-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
            min-width: 0;
        }

        .day-picker .day-center .day-weekday {
            font-size: 0.7rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .day-picker .day-center .day-badges { display: flex; gap: 4px; flex-wrap: wrap; }
        .day-picker .day-center .day-info-icon { color: var(--primary); font-size: 0.7rem; margin-right: 4px; }

        .badge-hoje {
            display: inline-block;
            background: linear-gradient(135deg, #39C6FF, #7B2EFF);
            color: #fff;
            font-size: 0.55rem;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(57, 198, 255, 0.4);
        }

        .badge-feriado {
            display: inline-block;
            background: rgba(199, 125, 255, 0.15);
            color: #C77DFF;
            font-size: 0.55rem;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(199, 125, 255, 0.3);
        }

        .day-picker .btn-hoje-quick {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.1), rgba(123, 46, 255, 0.1));
            color: var(--primary);
            border: 1px solid rgba(57, 198, 255, 0.25);
            border-radius: 14px;
            padding: 0 14px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .day-picker .btn-hoje-quick:hover {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.2), rgba(123, 46, 255, 0.2));
            box-shadow: 0 0 20px rgba(57, 198, 255, 0.3);
        }

        .btn-100-neon {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.1), rgba(123, 46, 255, 0.1));
            color: #fff;
            border: 1px solid rgba(57, 198, 255, 0.3);
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 18px auto;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(57, 198, 255, 0.1);
        }

        .btn-100-neon::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.5), transparent 40%, transparent 60%, rgba(199, 125, 255, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn-100-neon:hover {
            background: linear-gradient(135deg, rgba(57, 198, 255, 0.2), rgba(123, 46, 255, 0.2));
            border-color: rgba(57, 198, 255, 0.5);
            box-shadow: 0 0 25px rgba(57, 198, 255, 0.35);
            transform: translateY(-1px);
        }

        .btn-100-neon .badge-off {
            font-size: 0.6rem;
            font-weight: 900;
            background: rgba(255,255,255,0.08);
            color: #cbd5e1;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-100-neon.active {
            background: linear-gradient(135deg, #39C6FF, #B15CFF);
            border-color: transparent;
            box-shadow: 0 0 25px rgba(177, 92, 255, 0.5), 0 0 50px rgba(57, 198, 255, 0.3);
            animation: glowPulse100 2.5s ease-in-out infinite;
        }

        .btn-100-neon.active .badge-off {
            background: rgba(255,255,255,0.25);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }

        @keyframes glowPulse100 {
            0%, 100% { box-shadow: 0 0 25px rgba(177, 92, 255, 0.5), 0 0 50px rgba(57, 198, 255, 0.3); }
            50% { box-shadow: 0 0 35px rgba(177, 92, 255, 0.7), 0 0 70px rgba(57, 198, 255, 0.45); }
        }

        .calendar-popover {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            width: 300px;
            max-width: calc(100vw - 30px);
            background: rgba(11, 16, 38, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(57, 198, 255, 0.25);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(57, 198, 255, 0.1);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .calendar-popover.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .calendar-header .cal-month {
            font-size: 0.85rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .calendar-header .cal-nav {
            background: rgba(255,255,255,0.05);
            color: var(--primary);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .calendar-header .cal-nav:hover {
            background: rgba(57, 198, 255, 0.15);
            border-color: rgba(57, 198, 255, 0.3);
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-bottom: 6px;
        }

        .calendar-weekdays span {
            text-align: center;
            font-size: 0.6rem;
            font-weight: 900;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .calendar-day {

function mudarDia(delta) {
    let d = diaSelecionado + delta;
    let m = mes;
    let a = ano;
    
    if (d < 1) {
        m--;
        if (m < 0) { m = 11; a--; }
        d = diasNoMes(a, m);
    } else if (d > diasNoMes(a, m)) {
        m++;
        if (m > 11) { m = 0; a++; }
        d = 1;
    }
    
    diaSelecionado = d;
    mes = m;
    ano = a;
    recalcularTotais();
    renderizar();
}

function toggleCalendario(event) {
    if (event) event.stopPropagation();
    const pop = document.getElementById('calendar-popover');
    if (!pop) return;
    
    calMesAberto = mes;
    calAnoAberto = ano;
    
    const isOpen = pop.classList.contains('open');
    if (isOpen) {
        pop.classList.remove('open');
    } else {
        renderCalendario();
        pop.classList.add('open');
    }
}

function fecharCalendario() {
    const pop = document.getElementById('calendar-popover');
    if (pop) pop.classList.remove('open');
}

function calMudarMes(delta) {
    calMesAberto += delta;
    if (calMesAberto < 0) { calMesAberto = 11; calAnoAberto--; }
    if (calMesAberto > 11) { calMesAberto = 0; calAnoAberto++; }
    renderCalendario();
}

function renderCalendario() {
    const pop = document.getElementById('calendar-popover');
    if (!pop) return;
    
    const hoje = new Date();
    const primeiroDia = new Date(calAnoAberto, calMesAberto, 1).getDay();
    const totalDias = diasNoMes(calAnoAberto, calMesAberto);
    const diasMesAnterior = diasNoMes(calAnoAberto, calMesAberto - 1);
    
    let gridHTML = '';
    
    for (let i = primeiroDia - 1; i >= 0; i--) {
        const d = diasMesAnterior - i;
        gridHTML += `<div class="calendar-day other-month">${d}</div>`;
    }
    
    for (let d = 1; d <= totalDias; d++) {
        const dt = new Date(calAnoAberto, calMesAberto, d);
        const sem = dt.getDay();
        const chave = `${calAnoAberto}-${calMesAberto}-${d}`;
        const reg = registros[chave];
        const fer = isFeriado(calMesAberto, d, calAnoAberto);
        
        let classes = 'calendar-day';
        if (sem === 0) classes += ' weekend sunday';
        else if (sem === 6) classes += ' weekend';
        if (calAnoAberto === hoje.getFullYear() && calMesAberto === hoje.getMonth() && d === hoje.getDate()) classes += ' today';
        if (calAnoAberto === ano && calMesAberto === mes && d === diaSelecionado) classes += ' selected';
        if (fer) classes += ' feriado';
        if (reg && (reg.ent1 || reg.sai1 || reg.ent2 || reg.sai2) && !fer) classes += ' has-record';
        
        gridHTML += `<div class="${classes}" onclick="selecionarDiaCalendario(${calAnoAberto}, ${calMesAberto}, ${d})">${d}</div>`;
    }
    
    const totalCells = primeiroDia + totalDias;
    const resto = totalCells % 7;
    if (resto !== 0) {
        for (let i = 1; i <= (7 - resto); i++) {
            gridHTML += `<div class="calendar-day other-month">${i}</div>`;
        }
    }
    
    pop.innerHTML = `
        <div class="calendar-header">
            <button class="cal-nav" onclick="calMudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="cal-month">${mesesNomesCurto[calMesAberto]} ${calAnoAberto}</span>
            <button class="cal-nav" onclick="calMudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="calendar-weekdays">
            <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div class="calendar-grid">${gridHTML}</div>
    `;
}

function selecionarDiaCalendario(a, m, d) {

    const s2 = document.getElementById('manual-sai2').value.trim();

        if (!h) return true;
        const regex = /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/;
        return regex.test(h);
    };
    
    if (!validarHora(e1) || !validarHora(s1) || !validarHora(e2) || !validarHora(s2)) {
        mostrarToast('⚠️ Formato inválido! Use HH:MM');

    if (!registros[chaveSel]) registros[chaveSel] = {};

function calcularINSS(base) {
    const faixas = [
        { limite: 1518.00, aliquota: 0.075 },
        { limite: 2793.88, aliquota: 0.09 },
        { limite: 4190.83, aliquota: 0.12 },
        { limite: 8157.41, aliquota: 0.14 }
    ];
    let inss = 0;
    let anterior = 0;
    for (let f of faixas) {
        if (base > anterior) {
            const baseFaixa = Math.min(base, f.limite) - anterior;
            inss += baseFaixa * f.aliquota;
            anterior = f.limite;
        } else break;
    }
    return Math.min(inss, 951.62);
}

function calcularIRRF(base, dependentes = 0) {
    const deducaoDependente = 189.59;
    const baseCalculo = base - (dependentes * deducaoDependente);
    
    const faixas = [
        { limite: 2259.20, aliquota: 0, deducao: 0 },
        { limite: 2826.65, aliquota: 0.075, deducao: 169.44 },
        { limite: 3751.05, aliquota: 0.15, deducao: 381.44 },
        { limite: 4664.68, aliquota: 0.225, deducao: 662.77 },
        { limite: Infinity, aliquota: 0.275, deducao: 896.00 }
    ];
    
    for (let f of faixas) {
        if (baseCalculo <= f.limite) {
            const imposto = (baseCalculo * f.aliquota) - f.deducao;
            return Math.max(0, imposto);
        }
    }
    return 0;
}

function calcularFGTS(base) {
    return base * 0.08;
}

function gerarDemonstrativo() {
    recalcularTotais();
    
    const salarioBaseAuto = (jornadaDiaria / 60) * valorHoraNormal * 30;
    const salarioBase = salarioBaseMensal !== null && salarioBaseMensal > 0 ? salarioBaseMensal : salarioBaseAuto;
    
    // Contar dias trabalhados (com registro, exceto domingos e feriados)
    const diasTrabalhados = contarDiasTrabalhados();
    const valorDiasNormais = (salarioBase / 30) * diasTrabalhados;
    
    const horas100 = cacheTotais.extra100 / 60;
    const valorHoras100 = horas100 * valorHoraNormal * 2.0;
    
    let horas50 = 0;
    let valorHoras50 = 0;
    let labelTrimestre = null;
    
    const trimPag = getTrimestrePagamento(mes);
    if (trimPag) {
        const dadosTrim = calcularTrimestrePersonalizado(trimPag.trimestre, ano);
        horas50 = dadosTrim.extra50 / 60;
        valorHoras50 = horas50 * valorHoraNormal * 1.5;
        labelTrimestre = trimPag.label;
    }
    
    // DSR = (HE 50% + HE 100%) / 5
    const dsr = (valorHoras50 + valorHoras100) / 5;
    
    const chaveMes = `${ano}-${mes}`;
    const extrasMes = extrasPorMes[chaveMes] || [];
    const todosExtras = [...extrasFixos, ...extrasMes];
    
    const extrasVenc = todosExtras.filter(e => e.tipo === 'vencimento');
    const extrasDesc = todosExtras.filter(e => e.tipo === 'desconto');
    
    const totalExtrasVenc = extrasVenc.reduce((acc, e) => acc + (parseFloat(e.valor) || 0), 0);
    const totalExtrasDesc = extrasDesc.reduce((acc, e) => acc + (parseFloat(e.valor) || 0), 0);
    
    const totalVencimentos = valorDiasNormais + valorHoras100 + valorHoras50 + dsr + totalExtrasVenc;
    
    const inss = calcularINSS(totalVencimentos);
    const baseIRRFcalc = totalVencimentos - inss;
    const irrf = calcularIRRF(baseIRRFcalc, dependentesIRRF);
    const totalDescontos = inss + irrf + adiantamentoMensal + totalExtrasDesc;
    
    const valorLiquido = totalVencimentos - totalDescontos;
    
    const baseINSS = totalVencimentos;
    const baseFGTS = totalVencimentos;
    const valorFGTS = calcularFGTS(baseFGTS);
    const baseIRRF = baseIRRFcalc;
    
    return {
        salarioBase,
        diasTrabalhados,
        valorDiasNormais,
        horas50, horas100,
        valorHoras50, valorHoras100,
        dsr, labelTrimestre,
        totalExtrasVenc, totalExtrasDesc,
        extrasVenc, extrasDesc,
        totalVencimentos,
        inss, irrf, adiantamento: adiantamentoMensal, totalDescontos,
        valorLiquido,
        baseINSS, baseFGTS, valorFGTS, baseIRRF,
        dependentesIRRF
    };
}

function fmtMoeda(v) {

window.exportarBackup = function() {
    const dados = {
        _meta: {
            app: 'CheckPonto',
            versao: 'v4.6',
            exportadoEm: new Date().toISOString(),
            chave: CHAVE_ATUAL
        },
        registros: registros,
        jornadaDiaria: jornadaDiaria,
        valorHoraNormal: valorHoraNormal,
        observacoes: observacoes,
        salarioBaseMensal: salarioBaseMensal,
        adiantamentoMensal: adiantamentoMensal,
        dependentesIRRF: dependentesIRRF,
        extrasFixos: extrasFixos,
        extrasPorMes: extrasPorMes
    };
    
    const json = JSON.stringify(dados, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    const data = new Date();
    const dia = data.getDate().toString().padStart(2,'0');
    const mes = (data.getMonth() + 1).toString().padStart(2,'0');
    const ano = data.getFullYear();
    const hora = data.getHours().toString().padStart(2,'0');
    const min = data.getMinutes().toString().padStart(2,'0');
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `CheckPonto_Backup_${ano}-${mes}-${dia}_${hora}${min}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    mostrarToast('📥 Backup exportado com sucesso!');
};

window.importarBackup = function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            const dados = JSON.parse(e.target.result);
            
            if (!dados || (!dados.registros && !dados.jornadaDiaria && !dados.extrasFixos)) {
                mostrarToast('⚠️ Arquivo inválido!');
                event.target.value = '';
                return;
            }
            
            const qtdRegistros = dados.registros ? Object.keys(dados.registros).length : 0;
            const qtdExtras = dados.extrasFixos ? dados.extrasFixos.length : 0;
            
            const msg = `⚠️ ATENÇÃO!\n\n` +
                        `Isso vai SUBSTITUIR todos os seus dados atuais pelos dados do arquivo:\n\n` +
                        `📅 Registros de ponto: ${qtdRegistros}\n` +
                        `📌 Lançamentos fixos: ${qtdExtras}\n\n` +
                        `Deseja continuar?`;
            
            if (!confirm(msg)) {
                event.target.value = '';
                return;
            }
            
            registros = dados.registros || {};
            jornadaDiaria = dados.jornadaDiaria || 480;
            valorHoraNormal = dados.valorHoraNormal || 10.32;
            observacoes = dados.observacoes || {};
            salarioBaseMensal = dados.salarioBaseMensal !== undefined ? dados.salarioBaseMensal : null;
            adiantamentoMensal = dados.adiantamentoMensal || 0;
            dependentesIRRF = dados.dependentesIRRF || 0;
            extrasFixos = dados.extrasFixos || [];
            extrasPorMes = dados.extrasPorMes || {};
            extrasEmEdicao = {};
            
            salvar(true);
            recalcularTotais();
            renderizar();
            
            mostrarToast(`✅ Backup restaurado! ${qtdRegistros} registros carregados.`);
            
        } catch (err) {
            console.error(err);
            mostrarToast('❌ Erro ao ler o arquivo!');
        }
        
        event.target.value = '';
    };
    
    reader.onerror = function() {
        mostrarToast('❌ Erro ao ler o arquivo!');
        event.target.value = '';
    };
    
    reader.readAsText(file);
};

window.adicionarExtra = function() {
    const cod = document.getElementById('extra-cod');
    const desc = document.getElementById('extra-desc');
    const ref = document.getElementById('extra-ref');
    const val = document.getElementById('extra-valor');
    const tipo = document.getElementById('extra-tipo');
    const fixo = document.getElementById('extra-fixo');
    
    if (!desc || !val) return;
    
    const descVal = desc.value.trim();
    const valNum = parseFloat(val.value);
    
    if (!descVal) {
        mostrarToast('⚠️ Digite uma descrição!');
        return;
    }
    if (isNaN(valNum) || valNum <= 0) {
        mostrarToast('⚠️ Digite um valor válido!');
        return;
    }
    
    const item = {
        id: 'ext_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        cod: cod ? cod.value.trim() : '',
        desc: descVal,
        ref: ref ? ref.value.trim() : '',
        valor: valNum,
        tipo: tipo ? tipo.value : 'vencimento'
    };
    
    if (fixo && fixo.checked) {
        extrasFixos.push(item);
    } else {
        const chaveMes = `${ano}-${mes}`;
        if (!extrasPorMes[chaveMes]) extrasPorMes[chaveMes] = [];
        extrasPorMes[chaveMes].push(item);
    }
    
    salvar(true);
    renderizar();
    mostrarToast('✅ Lançamento adicionado!');
};

window.removerExtra = function(id, isFixo) {
    if (!confirm('Deseja realmente apagar este lançamento?')) return;
    
    if (isFixo) {
        extrasFixos = extrasFixos.filter(e => e.id !== id);
    } else {
        const chaveMes = `${ano}-${mes}`;
        if (extrasPorMes[chaveMes]) {
            extrasPorMes[chaveMes] = extrasPorMes[chaveMes].filter(e => e.id !== id);
        }
    }
    delete extrasEmEdicao[id];
    salvar(true);
    renderizar();
    mostrarToast('🗑️ Lançamento apagado!');
};

window.iniciarEdicaoExtra = function(id) {
    extrasEmEdicao[id] = true;
    renderizar();
};

window.cancelarEdicaoExtra = function(id) {
    delete extrasEmEdicao[id];
